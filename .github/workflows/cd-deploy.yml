name: CD Staging Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI for deployment commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  integration:
    name: Integration for deployment commit
    uses: ./.github/workflows/ci-integration.yml
    permissions:
      contents: read

  build-and-verify:
    name: Build and verify isolated stack
    needs: [ci, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      database_image: ${{ steps.publish.outputs.database_image }}
      app_image: ${{ steps.publish.outputs.app_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflow and deployment scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/cd-deploy.yml .github/workflows/ci.yml .github/workflows/ci-integration.yml
          shellcheck scripts/deploy-staging.sh scripts/smoke-test.sh scripts/seed-dev-data.sh
      - name: Test deployment script
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - name: Build database image for verification
        uses: docker/build-push-action@v6
        with:
          context: ./database
          load: true
          tags: tu-clubhub-database:verify
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database
      - name: Build application image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tu-clubhub-backend-frontend:verify
          cache-from: type=gha,scope=backend-frontend
          cache-to: type=gha,mode=max,scope=backend-frontend
      - name: Verify isolated Compose stack
        env:
          DATABASE_IMAGE: tu-clubhub-database:verify
          BACKEND_FRONTEND_IMAGE: tu-clubhub-backend-frontend:verify
        run: |
          cp .example.env .env
          docker compose config --services
          docker compose up -d --no-build --wait --wait-timeout 240 database backend-frontend
          ./scripts/seed-dev-data.sh
          ./scripts/smoke-test.sh
      - name: Capture verification diagnostics
        if: failure()
        run: docker compose logs --no-color || true
      - name: Remove isolated verification stack
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          [[ "$registry_owner" =~ ^[a-z0-9-]+$ && "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          for component in database backend-frontend; do
            image="ghcr.io/$registry_owner/tu-clubhub-$component"
            docker tag "tu-clubhub-$component:verify" "$image:sha-$COMMIT_SHA"
            log=$(mktemp)
            docker push "$image:sha-$COMMIT_SHA" | tee "$log"
            digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$log" | tail -n 1)
            rm -f "$log"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if [[ "$component" == database ]]; then key=database_image; else key=app_image; fi
            printf '%s=%s@%s\n' "$key" "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

  deploy-staging:
    name: Deploy verified images to staging
    needs: build-and-verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: tu-clubhub-staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject an outdated main deployment
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$current_main" == "$COMMIT_SHA" ]] || { echo '::error::Main advanced while this run was waiting; refusing stale deployment.'; exit 1; }
      - name: Configure verified SSH host
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" && -n "$HOST" && -n "$USER" && -n "$BASE_URL" ]]
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -z "$PORT" || "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/staging_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging_key" "$HOME/.ssh/known_hosts"
      - name: Transfer configuration and deploy immutable images
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          PORT: ${{ vars.STAGING_PORT }}
          DATABASE_IMAGE: ${{ needs.build-and-verify.outputs.database_image }}
          APP_IMAGE: ${{ needs.build-and-verify.outputs.app_image }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_pattern='^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
          [[ "$DATABASE_IMAGE" =~ $image_pattern && "$APP_IMAGE" =~ $image_pattern && "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh_args=(-i "$HOME/.ssh/staging_key" -p "${PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          tar -cf - compose.staging.yaml scripts/deploy-staging.sh | ssh "${ssh_args[@]}" "$USER@$HOST" 'mkdir -p /opt/tu-clubhub-staging/release && tar -xf - -C /opt/tu-clubhub-staging/release'
          # Image references and SHA are validated above and intentionally expanded locally.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$USER@$HOST" "bash /opt/tu-clubhub-staging/release/scripts/deploy-staging.sh '$DATABASE_IMAGE' '$APP_IMAGE' '$COMMIT_SHA'"
      - name: Check external staging health and home page
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          COMMIT_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.build-and-verify.outputs.app_image }}
        run: |
          IMAGE_DIGEST=${APP_IMAGE##*@}
          python3 scripts/verify-staging.py "$BASE_URL" "$COMMIT_SHA" "$IMAGE_DIGEST"
      - name: Write deployment summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          DATABASE_IMAGE: ${{ needs.build-and-verify.outputs.database_image }}
          APP_IMAGE: ${{ needs.build-and-verify.outputs.app_image }}
        run: |
          {
            echo "## Staging deployment: ${{ job.status }}"
            echo "- Commit: $COMMIT_SHA"
            echo "- Database: $DATABASE_IMAGE"
            echo "- Application: $APP_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
