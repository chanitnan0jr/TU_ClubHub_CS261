spring:
  application:
    name: clubhub
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

tu:
  auth:
    mode: ${TU_AUTH_MODE:real}
    endpoint-url: ${TU_AUTH_ENDPOINT_URL:}
    application-key: ${TU_AUTH_APPLICATION_KEY:}
    connect-timeout: ${TU_AUTH_CONNECT_TIMEOUT:3s}
    read-timeout: ${TU_AUTH_READ_TIMEOUT:5s}
