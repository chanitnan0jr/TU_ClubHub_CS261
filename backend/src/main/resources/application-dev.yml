
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tu_clubhub
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

tu:
  auth:
    mode: ${TU_AUTH_MODE:mock}
