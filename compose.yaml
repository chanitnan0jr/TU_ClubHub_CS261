name: tu-clubhub

services:
  # ============================================================================
  # Database Service: PostgreSQL 17 Alpine
  # ============================================================================
  db:
    image: postgres:17-alpine
    container_name: tu-clubhub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tu_clubhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      # Bind to loopback interface only to prevent exposing database port to public network
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tu_clubhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Application Service: Spring Boot with embedded React frontend
  # Default service when running: docker compose up --build
  # Demo data (dev only): run scripts/seed-dev-data.sh after the app has started
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tu-clubhub-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tu_clubhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      TU_AUTH_MODE: ${TU_AUTH_MODE:-mock}
      TU_AUTH_ENDPOINT_URL: ${TU_AUTH_ENDPOINT_URL:-}
      TU_AUTH_APPLICATION_KEY: ${TU_AUTH_APPLICATION_KEY:-}
    ports:
      - "${PORT:-8080}:8080"

  # ============================================================================
  # Split Architecture Option: Standalone Backend + Frontend Nginx Reverse Proxy
  # Run via: docker compose --profile split up --build
  # ============================================================================
  backend:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tu-clubhub-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tu_clubhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      TU_AUTH_MODE: ${TU_AUTH_MODE:-mock}
      TU_AUTH_ENDPOINT_URL: ${TU_AUTH_ENDPOINT_URL:-}
      TU_AUTH_APPLICATION_KEY: ${TU_AUTH_APPLICATION_KEY:-}
    expose:
      - "8080"

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tu-clubhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  # Named volume for PostgreSQL persistence
  postgres_data:
    driver: local
