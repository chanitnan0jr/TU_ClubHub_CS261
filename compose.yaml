name: tu-clubhub

services:
  # ============================================================================
  # Container 1/3 — Database Service: PostgreSQL 17 Alpine
  # ============================================================================
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: ${DATABASE_IMAGE:-tu-clubhub-database:latest}
    container_name: tu-clubhub-db
    hostname: database
    restart: unless-stopped
    networks:
      default:
        aliases:
          - db
          - database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tu_clubhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      # Bind to loopback interface only to prevent exposing database port to public network
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tu_clubhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Container 2/3 — Backend Service: Spring Boot REST API
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-tu-clubhub-backend:latest}
    container_name: tu-clubhub-backend
    hostname: backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
        aliases:
          - api
          - backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # The container always listens on 8080; Nginx in the frontend container proxies /api/ here.
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-tu_clubhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      TU_AUTH_MODE: ${TU_AUTH_MODE:-mock}
      TU_AUTH_ENDPOINT_URL: ${TU_AUTH_ENDPOINT_URL:-}
      TU_AUTH_APPLICATION_KEY: ${TU_AUTH_APPLICATION_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ============================================================================
  # Container 3/3 — Frontend Service: React SPA + Nginx Reverse Proxy
  # Default 3-container stack when running: docker compose up --build
  # Demo data (dev only): run scripts/seed-dev-data.sh after the stack has started
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-tu-clubhub-frontend:latest}
    container_name: tu-clubhub-frontend
    hostname: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        aliases:
          - web
          - frontend
    ports:
      - "${FRONTEND_PORT:-${PORT:-8080}}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional legacy unified 2-container mode (Spring Boot serving embedded React SPA).
  # Start explicitly with: docker compose --profile unified up -d --build database backend-frontend
  backend-frontend:
    profiles: ["unified"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_FRONTEND_IMAGE:-tu-clubhub-backend-frontend:latest}
    container_name: tu-clubhub-backend-frontend
    hostname: backend-frontend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
        aliases:
          - app
          - backend-frontend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # The container always listens on 8080; .env PORT only picks the host port below.
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-tu_clubhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      TU_AUTH_MODE: ${TU_AUTH_MODE:-mock}
      TU_AUTH_ENDPOINT_URL: ${TU_AUTH_ENDPOINT_URL:-}
      TU_AUTH_APPLICATION_KEY: ${TU_AUTH_APPLICATION_KEY:-}
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  # Named volume for PostgreSQL persistence
  postgres_data:
    driver: local
