openapi: 3.0.3
info:
  title: TU ClubHub Recruitment Rounds API
  version: 1.0.0
  description: >-
    US-07/US-08. Committee-only management API, separate from existing public
    recruitment-rounds API. No physical DELETE; CLOSE/CANCEL retain applications.
    Dates require RFC3339 offset, stored as UTC. Database constraints and additional
    state/edit rules apply alongside the authorization policy adopted on 2026-10-19
    in the [Permission Matrix](../security/permission-matrix.md).
    Every operation requires an ACTIVE account, student profile, club, membership,
    and assignment for the actual target club. Membership must have joined_at <= now
    and ended_at IS NULL; assignment must have revoked_at IS NULL and
    starts_at <= now < ends_at, evaluated with backend UTC time on every request
    and again inside write transactions. ADMIN alone grants no access.
    A caller with an application in a round, in any status, cannot manage or read
    that round as committee; exclude such rounds before listing/pagination/counts.
    COMMITTEE or PRESIDENT can create, edit, publish, and close rounds; CANCEL
    requires an effective PRESIDENT, an unpublished result, and an audited reason.
    Selection-result publication is a separate future workflow, not PUBLISH here.
    GET operations and CANCEL are not implemented yet; CANCEL also needs its reason
    field specified before implementation. The matrix lists remaining guard work.
    Source status reviewed on 2026-10-19: POST, PUT, and PATCH PUBLISH/CLOSE have
    handlers. Frontend integration and complete permission enforcement remain pending.
    Task74's Sprint 2 design handoff dated 2026-10-27 is Draft / Pending Team Review.
    User decisions recorded that date use 403 ACCESS_DENIED for an existing private
    resource outside the caller's authorization and 404 for a nonexistent resource;
    this revises the target error policy, not runtime implementation. PUBLISH here
    remains recruitment publication. The user confirmed ชนิตว์นันท์ as Owner of the
    two Draft selection-result Stories; FE/BE assignment, team review and separate
    API/audit design remain pending under API_v1.md section 8.1 and T74-D03.
    INTERVIEW is excluded from MVP; UNDER_REVIEW is optional through an
    explicit action, while reads never mutate application state. This document
    adds no application workflow operation or claim of completed PO/Reviewer review.
  x-sprint2-design-handoff:
    status: draft-pending-review
    prepared-at: '2026-10-27'
    artefact: ../architecture/task74-sprint2-analysis.md
    permission-matrix: ../security/permission-matrix.md#s2-permission-matrix
    state-machine: ../architecture/system-architecture.md#s2-application-state-machine
    business-rules: ../architecture/system-architecture.md#s2-business-rules
    decision-log: ../architecture/system-architecture.md#s2-decision-log
    selection-results-draft: ../stories/sprint2/selection-results-draft.md
    decision-source: explicit-user-instruction-2026-10-27
    decision-review-status: pending-team-review
    recorded-decisions:
      T74-D01: existing-unauthorized-private-resource-403-nonexistent-404
      T74-D02: no-interview-mvp-optional-explicit-review-direct-decision-after-close
      T74-D03: two-draft-selection-stories-owner-confirmed-team-review-pending
      T74-D05: same-final-action-replay-without-writes-opposite-action-409
      T74-D06: fresh-action-server-time-after-lock-recheck-automatic-expiry
      T74-D07: same-application-replay-no-writes-all-prior-membership-rows-reject-fresh-confirmation-no-reactivation
    open-items:
      - selection-result-team-review-fe-be-owner-assignment-api-dto-and-publication-audit-design
      - expiry-worker-frequency-catch-up-mechanism-and-acceptable-lag
servers:
  - url: http://localhost:8080
security:
  - sessionAuth: []
paths:
  /api/v1/clubs/{clubId}/rounds:
    parameters:
      - name: clubId
        in: path
        required: true
        description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
    get:
      operationId: listRounds
      x-implementation-status: pending
      tags:
        - Recruitment rounds
      summary: listRounds
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version mismatch, invalid state or edit policy conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: All rounds for authorized committee, including drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundPage"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: publicationStatus
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - CANCELLED
      description:
        "Stable ordering: createdAt DESC, id DESC. Missing club: 404. Empty
        existing club: 200 with empty items."
    post:
      operationId: createRound
      x-implementation-status: implemented
      tags:
        - Recruitment rounds
      summary: createRound
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version mismatch, invalid state or edit policy conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Draft created atomically with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
          headers:
            Location:
              description: URI of created round
              schema:
                type: string
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description:
            Obtain current token from GET /api/v1/auth/csrf; renew after
            login.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundWrite"
  /api/v1/clubs/{clubId}/rounds/{roundId}:
