openapi: 3.0.3
info:
  title: TU ClubHub Recruitment Rounds API
  version: 1.1.0
  description: >-
    US-07/US-08. Committee-only management API, separate from existing public
    recruitment-rounds API. No physical DELETE; CLOSE/CANCEL retain applications.
    Dates require RFC3339 offset, stored as UTC. Database constraints and additional
    state/edit rules apply alongside the authorization policy adopted on 2026-10-19
    in the [Permission Matrix](../security/permission-matrix.md).
    Every operation requires an ACTIVE account, student profile, club, membership,
    and assignment for the actual target club. Membership must have joined_at <= now
    and ended_at IS NULL; assignment must have revoked_at IS NULL and
    starts_at <= now < ends_at, evaluated with backend UTC time on every request
    and again inside write transactions. ADMIN alone grants no access.
    A caller with an application in a round, in any status, cannot manage or read
    that round as committee; exclude such rounds before listing/pagination/counts.
    COMMITTEE or PRESIDENT can create, edit, publish, and close rounds; CANCEL
    requires an effective PRESIDENT, an unpublished result, and an audited reason.
    Selection-result publication is specified on POST /api/v1/rounds/{roundId}/publish-results
    in openapi.yaml (Task75), not PUBLISH here.
    Task75 finalizes the Sprint 2 design contract (docs/architecture/task75-sprint2-design.md),
    including 409 RESOURCE_CONFLICT with reason QUESTION_HAS_ANSWERS when attempting
    to edit or delete a screening question that already has submitted answers (Task51),
    and 403 ACCESS_DENIED for an existing private resource outside the caller's
    authorization versus 404 RESOURCE_NOT_FOUND for a nonexistent resource (T74-D01).
  x-sprint2-design-handoff:
    status: specified-in-task75
    prepared-at: '2026-10-28'
    analysis-artefact: ../architecture/task74-sprint2-analysis.md
    design-artefact: ../architecture/task75-sprint2-design.md
    permission-matrix: ../security/permission-matrix.md#s2-permission-matrix
    state-machine: ../architecture/system-architecture.md#s2-application-state-machine
    business-rules: ../architecture/system-architecture.md#s2-business-rules
    decision-log: ../architecture/system-architecture.md#s2-decision-log
    selection-results-draft: ../stories/sprint2/selection-results-draft.md
    decision-source: explicit-user-instruction-2026-10-27-and-task75-design
    decision-review-status: ready-for-team-review
    recorded-decisions:
      T74-D01: existing-unauthorized-private-resource-403-nonexistent-404
      T74-D02: no-interview-mvp-optional-explicit-review-direct-decision-after-close
      T74-D03: separate-decision-and-publication-contracts-specified-in-openapi-yaml
      T74-D05: same-final-action-replay-without-writes-opposite-action-409
      T74-D06: fresh-action-server-time-after-lock-recheck-automatic-expiry-60s-worker-proposal-pending-po-review
      T74-D07: same-application-replay-no-writes-all-prior-membership-rows-reject-fresh-confirmation-no-reactivation
servers:
  - url: http://localhost:8080
security:
  - sessionAuth: []
paths:
  /api/v1/clubs/{clubId}/rounds:
    parameters:
      - name: clubId
        in: path
        required: true
        description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
    get:
      operationId: listRounds
      x-implementation-status: implemented
      tags:
        - Recruitment rounds
      summary: List the club's recruitment rounds for its committee
      description: >-
        Returns the club's rounds in every state, including drafts and cancelled or
        manually closed rounds, each with its questions in display order. Stable
        ordering: createdAt DESC, id DESC. Requires a currently effective COMMITTEE
        or PRESIDENT assignment for clubId; permission is checked before the club is
        looked up, as for the round writes on this path, so a club the caller does
        not manage returns 403 ACCESS_DENIED whether or not it exists. Rounds the
        caller has applied to, in any application status, are left out before
        paging and totals. An empty page, or a page past the last one, returns 200
        with empty items. Responses include Cache-Control: no-store.
      parameters:
        - name: page
          in: query
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: publicationStatus
          in: query
          description: Return only rounds with this publicationStatus; omit for all.
          schema:
            type: string
            enum:
              - DRAFT
              - PUBLISHED
              - CANCELLED
      responses:
        "200":
          description: One page of the club's rounds, drafts included
          headers:
            Cache-Control:
              description: Always includes no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundPage"
              examples:
                roundsPage:
                  summary: Draft and published rounds
                  value:
                    items:
                      - id: "70002"
                        clubId: "20001"
                        title: Recruitment 2569/2
                        academicYear: 2569
                        semester: 2
                        description: Open to every undergraduate who enjoys coding.
                        eligibilityText: null
                        opensAt: "2027-01-05T02:00:00Z"
                        closesAt: "2027-01-19T16:59:59Z"
                        confirmationDeadline: "2027-02-02T16:59:59Z"
                        resultsScheduledAt: null
                        publicationStatus: DRAFT
                        closedAt: null
                        publishedAt: null
                        resultsPublishedAt: null
                        createdAt: "2026-11-02T03:00:00Z"
                        updatedAt: "2026-11-02T03:00:00Z"
                        version: 0
                        questions: []
                      - id: "70001"
                        clubId: "20001"
                        title: Recruitment 2569/1
                        academicYear: 2569
                        semester: 1
                        description: Open to every undergraduate who enjoys coding.
                        eligibilityText: First- and second-year students
                        opensAt: "2026-11-10T02:00:00Z"
                        closesAt: "2026-11-24T16:59:59Z"
                        confirmationDeadline: "2026-12-08T16:59:59Z"
                        resultsScheduledAt: "2026-12-01T09:00:00Z"
                        publicationStatus: PUBLISHED
                        closedAt: null
                        publishedAt: "2026-11-05T04:00:00Z"
                        resultsPublishedAt: null
                        createdAt: "2026-11-01T03:00:00Z"
                        updatedAt: "2026-11-05T04:00:00Z"
                        version: 1
                        questions:
                          - id: "81001"
                            prompt: Why do you want to join?
                            required: true
                            displayOrder: 1
                            maxLength: 2000
                    page: 0
                    size: 20
                    totalElements: 2
                    totalPages: 1
                emptyClub:
                  summary: Club with no rounds the caller may see
                  value:
                    items: []
                    page: 0
                    size: 20
                    totalElements: 0
                    totalPages: 0
        "400":
          description: Invalid clubId (INVALID_RESOURCE_ID) or page, size or publicationStatus (VALIDATION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidClubId:
                  $ref: "#/components/examples/InvalidClubIdProblem"
                invalidQuery:
                  summary: publicationStatus is not one of the listed values
                  value:
                    type: urn:tuclubhub:problem:validation-error
                    title: Request validation failed
                    status: 400
                    detail: One or more request fields or parameters are invalid.
                    instance: /api/v1/clubs/20001/rounds
                    code: VALIDATION_FAILED
                    traceId: 00000000-0000-4000-8000-000000000002
                    fieldErrors:
                      - field: publicationStatus
                        code: INVALID
                        message: Value does not meet this field's constraints.
        "401":
          $ref: "#/components/responses/RoundReadUnauthorized"
        "403":
          $ref: "#/components/responses/RoundReadForbidden"
    post:
      operationId: createRound
      x-implementation-status: implemented
      tags:
        - Recruitment rounds
      summary: createRound
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version mismatch, invalid state or edit policy conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Draft created atomically with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
          headers:
            Location:
              description: URI of created round
              schema:
                type: string
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description:
            Obtain current token from GET /api/v1/auth/csrf; renew after
            login.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundWrite"
  /api/v1/clubs/{clubId}/rounds/{roundId}:
    parameters:
      - name: clubId
        in: path
        required: true
        description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
      - name: roundId
        in: path
        required: true
        description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
    get:
      operationId: getRound
      x-implementation-status: implemented
      tags:
        - Recruitment rounds
      summary: Get one of the club's recruitment rounds with its questions
      description: >-
        Returns the round in any state, including a draft, with its questions in
        display order; use its version for PUT and PATCH. Requires a currently
        effective COMMITTEE or PRESIDENT assignment for clubId, checked before the
        round is looked up (403 ACCESS_DENIED otherwise). A roundId that does not
        exist, or that belongs to another club, returns 404 RESOURCE_NOT_FOUND. A
        caller who has applied to the round, in any application status, gets 403
        ACCESS_DENIED. Responses include Cache-Control: no-store.
      responses:
        "200":
          description: The round and its questions
          headers:
            Cache-Control:
              description: Always includes no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
              examples:
                draftRound:
                  summary: Draft round with one question
                  value:
                    id: "70002"
                    clubId: "20001"
                    title: Recruitment 2569/2
                    academicYear: 2569
                    semester: 2
                    description: Open to every undergraduate who enjoys coding.
                    eligibilityText: null
                    opensAt: "2027-01-05T02:00:00Z"
                    closesAt: "2027-01-19T16:59:59Z"
                    confirmationDeadline: "2027-02-02T16:59:59Z"
                    resultsScheduledAt: null
                    publicationStatus: DRAFT
                    closedAt: null
                    publishedAt: null
                    resultsPublishedAt: null
                    createdAt: "2026-11-02T03:00:00Z"
                    updatedAt: "2026-11-02T03:00:00Z"
                    version: 0
                    questions:
                      - id: "81002"
                        prompt: Why do you want to join?
                        required: true
                        displayOrder: 1
                        maxLength: 2000
        "400":
          description: clubId or roundId is not a positive BIGINT (INVALID_RESOURCE_ID)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidClubId:
                  $ref: "#/components/examples/InvalidClubIdProblem"
        "401":
          $ref: "#/components/responses/RoundReadUnauthorized"
        "403":
          $ref: "#/components/responses/RoundReadForbidden"
        "404":
          description: No round with this roundId in the club (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                roundNotFound:
                  summary: Round does not exist or belongs to another club
                  value:
                    type: urn:tuclubhub:problem:resource-not-found
                    title: Resource not found
                    status: 404
                    detail: No resource was found for this identifier.
                    instance: /api/v1/clubs/20001/rounds/70009
                    code: RESOURCE_NOT_FOUND
                    traceId: 00000000-0000-4000-8000-000000000005
                    fieldErrors: []
    put:
      operationId: replaceRound
      x-implementation-status: implemented
      tags:
        - Recruitment rounds
      summary: replaceRound
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        '409':
          description: Answered-question protection (QUESTION_HAS_ANSWERS), version, round-state or edit-policy
            conflict; no partial mutation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-conflict
                title: Resource state conflict
                status: 409
                detail: Question has answers
                instance: /api/v1/clubs/20001/rounds/70001
                code: RESOURCE_CONFLICT
                reason: QUESTION_HAS_ANSWERS
                fieldErrors: []
                traceId: 00000000-0000-4000-8000-000000000051
        "415":
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description:
            Obtain current token from GET /api/v1/auth/csrf; renew after
            login.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundReplace"
      description:
        >-
        Replace all editable data; omitted nullable fields become null. Never upsert. Questions replaced
        atomically only when policy permits. Version checked atomically. Full replacement deletes and
        recreates every old question ID. After permission, parent-row lock and version checks, any answer
        referencing an existing question in this round rejects the entire replacement with 409
        RESOURCE_CONFLICT and root reason QUESTION_HAS_ANSWERS, including an empty questions array. No
        round, question or answer changes on rejection. Other application/state restrictions remain in
        force.
    patch:
      operationId: transitionRound
      x-implementation-status: partial
      tags:
        - Recruitment rounds
      summary: transitionRound
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/PRESIDENT/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Version mismatch, invalid state or edit policy conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description:
            Obtain current token from GET /api/v1/auth/csrf; renew after
            login.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundPatch"
      description:
        "Command-style PATCH using application/json; not JSON Merge Patch.
        PUBLISH: DRAFT -> PUBLISHED. CLOSE: manually close a currently accepting PUBLISHED
        round. Both require COMMITTEE or PRESIDENT. CANCEL: DRAFT/PUBLISHED -> CANCELLED,
        requires PRESIDENT and no published selection results; preserve all application
        records and audit a reason. CANCEL is not implemented and its reason field
        must be specified before implementation. Other transitions: 409. Server
        assigns timestamps. Version checked atomically. PUBLISH publishes recruitment,
        not selection results. All actions enforce the matrix self-review restriction."
  /api/v1/rounds/{roundId}/questions:
    parameters:
    - name: roundId
      in: path
      required: true
      description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    get:
      tags:
      - Application questions
      operationId: listApplicationQuestions
      summary: List application questions for one recruitment round
      description: Requires an ACTIVE account and currently effective COMMITTEE or PRESIDENT assignment and membership
        for the club owning this round. ADMIN alone does not authorize access. A committee member who has submitted
        an application to this round cannot read or manage its questions. Check authorization against the actual
        round owner, including within write transactions. Ordered by displayOrder ASC, id ASC. An empty round
        returns {"items":[]}.
      responses:
        '200':
          description: Questions in display order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationQuestionList'
        '400':
          description: Invalid round/question ID, JSON body, or validation (including blank questionText or invalid
            order)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid session (CSRF failure may take precedence)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Existing private resource outside the caller's authorized round/club, ineffective committee rights, self-review restriction (ACCESS_DENIED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Round not found, or question not found under the authorized round; an existing private resource without permission uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Application questions
      operationId: createApplicationQuestion
      summary: Append one application question to a recruitment round
      description: Requires an ACTIVE account and currently effective COMMITTEE or PRESIDENT assignment and membership
        for the club owning this round. ADMIN alone does not authorize access. A committee member who has submitted
        an application to this round cannot read or manage its questions. Check authorization against the actual
        round owner, including within write transactions. The server assigns the next 1-based displayOrder atomically;
        use the order endpoint to reorder. Creation is subject to round edit-state policy.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Obtain current token from GET /api/v1/auth/csrf; renew after login.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationQuestionWrite'
      responses:
        '201':
          description: Question created
          headers:
            Location:
              description: URI of the created question
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationQuestion'
        '400':
          description: Invalid round/question ID, JSON body, or validation (including blank questionText or invalid
            order)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid session (CSRF failure may take precedence)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Existing private resource outside the caller's authorized round/club, ineffective committee rights, self-review restriction (ACCESS_DENIED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Round not found, or question not found under the authorized round; an existing private resource without permission uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Round state/edit-policy conflict or concurrent modification
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rounds/{roundId}/questions/{questionId}:
    parameters:
    - name: roundId
      in: path
      required: true
      description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    - name: questionId
      in: path
      required: true
      description: ID of a question belonging to the specified recruitment round
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    put:
      tags:
      - Application questions
      operationId: replaceApplicationQuestion
      summary: Replace editable fields of one application question
      description: >-
        Requires an ACTIVE account and currently effective COMMITTEE or PRESIDENT assignment and membership
        for the club owning this round. ADMIN alone does not authorize access. A committee member who has
        submitted an application to this round cannot read or manage its questions. Check authorization
        against the actual round owner, including within write transactions. PUT requires both fields; it
        does not change displayOrder. Use PUT /order for ordering. The question must belong to roundId.
        Modification is rejected with 409 RESOURCE_CONFLICT (reason QUESTION_HAS_ANSWERS) if one or more
        answers in application_answers reference this question (Task51). Task51 requires an open DRAFT for
        unanswered edits. Other answered questions in that draft do not block this target. Any answer
        referencing this exact question blocks it before the round-state check. The parent FOR UPDATE lock
        is acquired before checking answers; submission holds FOR SHARE on the same parent until its answers
        commit. No rejected write changes the question, answers or round version.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Obtain current token from GET /api/v1/auth/csrf; renew after login.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationQuestionWrite'
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationQuestion'
        '400':
          description: Invalid round/question ID, JSON body, or validation (including blank questionText or invalid
            order)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid session (CSRF failure may take precedence)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Existing private resource outside the caller's authorized round/club, ineffective committee rights, self-review restriction (ACCESS_DENIED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Round not found, or question not found under the authorized round; an existing private resource without permission uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Answered-question protection (QUESTION_HAS_ANSWERS), version, round-state or edit-policy
            conflict; no partial mutation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-conflict
                title: Resource state conflict
                status: 409
                detail: Question has answers
                instance: /api/v1/rounds/70001/questions/81001
                code: RESOURCE_CONFLICT
                reason: QUESTION_HAS_ANSWERS
                fieldErrors: []
                traceId: 00000000-0000-4000-8000-000000000051
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Application questions
      operationId: deleteApplicationQuestion
      summary: Delete one application question only if it has no answers
      description: >-
        Requires an ACTIVE account and currently effective COMMITTEE or PRESIDENT assignment and membership
        for the club owning this round. ADMIN alone does not authorize access. A committee member who has
        submitted an application to this round cannot read or manage its questions. Check authorization
        against the actual round owner, including within write transactions. Deletion is rejected when one
        or more answers reference this question (409 RESOURCE_CONFLICT with reason QUESTION_HAS_ANSWERS).
        Other edit-state policy conflicts also return 409. Never cascade-delete answers. Recompact remaining
        displayOrder values transactionally. Task51 requires an open DRAFT for unanswered deletion; answers
        to other questions do not block this target. Check this exact question after the parent FOR UPDATE
        lock, shared with the submission FOR SHARE protocol. Deletion compacts only unanswered positions
        without moving answered rows; gaps are valid. Rejection changes no question, answer or round
        version.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Obtain current token from GET /api/v1/auth/csrf; renew after login.
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Question deleted (no response body)
        '400':
          description: Invalid round/question ID, JSON body, or validation (including blank questionText or invalid
            order)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid session (CSRF failure may take precedence)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Existing private resource outside the caller's authorized round/club, ineffective committee rights, self-review restriction (ACCESS_DENIED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Round not found, or question not found under the authorized round; an existing private resource without permission uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Answered-question protection (QUESTION_HAS_ANSWERS), version, round-state or edit-policy
            conflict; no partial mutation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-conflict
                title: Resource state conflict
                status: 409
                detail: Question has answers
                instance: /api/v1/rounds/70001/questions/81001
                code: RESOURCE_CONFLICT
                reason: QUESTION_HAS_ANSWERS
                fieldErrors: []
                traceId: 00000000-0000-4000-8000-000000000051
  /api/v1/rounds/{roundId}/questions/order:
    parameters:
    - name: roundId
      in: path
      required: true
      description: Positive PostgreSQL BIGINT decimal ID; maximum 9223372036854775807
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    put:
      tags:
      - Application questions
      operationId: reorderApplicationQuestions
      summary: Set the full application-question order for one round
      description: >-
        Requires an ACTIVE account and currently effective COMMITTEE or PRESIDENT assignment and membership
        for the club owning this round. ADMIN alone does not authorize access. A committee member who has
        submitted an application to this round cannot read or manage its questions. Check authorization
        against the actual round owner, including within write transactions. questionIds must contain every
        currently existing question ID in the round exactly once, including no foreign IDs; [] is valid only
        when no questions exist. Reorder is atomic and assigns displayOrder = 1..n when no answered anchors
        exist. Missing, duplicate or foreign IDs return 400. A stale set changed concurrently returns 409.
        Editing remains subject to round state policy. Task51 follows US-08 BR-05/BR-07: answered questions
        retain their exact numeric displayOrder. Assign unanswered questions to available positions in the
        requested relative order, retaining gaps where needed. A layout that cannot keep every answered
        position fails atomically with 409 RESOURCE_CONFLICT and reason QUESTION_HAS_ANSWERS. A mixed open
        DRAFT is allowed; PUBLISHED/CLOSED remain blocked. When no answers exist the result is 1..n.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Obtain current token from GET /api/v1/auth/csrf; renew after login.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationQuestionOrderRequest'
      responses:
        '200':
          description: Questions in the updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationQuestionList'
        '400':
          description: Invalid round/question ID, JSON body, or validation (including blank questionText or invalid
            order)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid session (CSRF failure may take precedence)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Existing private resource outside the caller's authorized round/club, ineffective committee rights, self-review restriction (ACCESS_DENIED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Round not found, or question not found under the authorized round; an existing private resource without permission uses 403 ACCESS_DENIED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Answered-question protection (QUESTION_HAS_ANSWERS), version, round-state or edit-policy
            conflict; no partial mutation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-conflict
                title: Resource state conflict
                status: 409
                detail: Question has answers
                instance: /api/v1/rounds/70001/questions/order
                code: RESOURCE_CONFLICT
                reason: QUESTION_HAS_ANSWERS
                fieldErrors: []
                traceId: 00000000-0000-4000-8000-000000000051
        '415':
          description: Unsupported media type
