              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session cookie; confirm deployment cookie name.
  examples:
    InvalidClubIdProblem:
      summary: clubId is not a positive BIGINT
      value:
        type: urn:tuclubhub:problem:invalid-resource-id
        title: Invalid resource identifier
        status: 400
        detail: A resource identifier has an invalid format.
        instance: /api/v1/clubs/abc/rounds
        code: INVALID_RESOURCE_ID
        traceId: 00000000-0000-4000-8000-000000000001
        fieldErrors:
          - field: clubId
            code: INVALID
            message: Value does not meet this field's constraints.
  responses:
    RoundReadUnauthorized:
      description: No valid session, or the session has expired (AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            authenticationRequired:
              summary: Not signed in
              value:
                type: urn:tuclubhub:problem:authentication-required
                title: Authentication required
                status: 401
                detail: Sign in to access this resource.
                instance: /api/v1/clubs/20001/rounds
                code: AUTHENTICATION_REQUIRED
                traceId: 00000000-0000-4000-8000-000000000003
                fieldErrors: []
    RoundReadForbidden:
      description: >-
        ACCESS_DENIED when the caller has no currently effective committee
        assignment for clubId (including a club that does not exist) or has
        applied to the requested round; ACCOUNT_NOT_ALLOWED when the account is
        suspended, which also ends the session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            accessDenied:
              summary: Not a current committee member of this club
              value:
                type: urn:tuclubhub:problem:access-denied
                title: Access denied
                status: 403
                detail: You are not allowed to access this resource.
                instance: /api/v1/clubs/20001/rounds
                code: ACCESS_DENIED
                traceId: 00000000-0000-4000-8000-000000000004
                fieldErrors: []
            accountNotAllowed:
              summary: Suspended account
              value:
                type: urn:tuclubhub:problem:account-not-allowed
                title: Account not allowed
                status: 403
                detail: This account is not allowed to use TU-ClubHub.
                instance: /api/v1/clubs/20001/rounds
                code: ACCOUNT_NOT_ALLOWED
                traceId: 00000000-0000-4000-8000-000000000006
                fieldErrors: []
