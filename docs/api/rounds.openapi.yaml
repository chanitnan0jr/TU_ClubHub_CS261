      description:
        Replace all editable data; omitted nullable fields become null.
        Never upsert. Questions replaced atomically only when policy permits. Version
        checked atomically.
    patch:
      operationId: transitionRound
      x-implementation-status: partial
      tags:
        - Recruitment rounds
      summary: transitionRound
      responses:
        "400":
          description: Invalid JSON, fields, dates or query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session (CSRF failure can take precedence)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Active/term/committee/PRESIDENT/self-review or existing-private-resource authorization failure (ACCESS_DENIED), suspended account (ACCOUNT_NOT_ALLOWED), or CSRF_INVALID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Club or round/relationship not found within the authorized scope; an existing private resource outside the caller's authorization uses 403 ACCESS_DENIED
          content:
