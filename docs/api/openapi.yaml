              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-not-found
                title: Resource not found
                status: 404
                instance: /api/v1/rounds/70001/application-form
                code: RESOURCE_NOT_FOUND
                traceId: example-form-trace
        '409':
          description: Previously published round is cancelled, not yet open, or closed; no read-only preview outside the submission window
          headers:
            Cache-Control:
