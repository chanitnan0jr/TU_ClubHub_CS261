      description: >-
        Task52 adds this club-scoped entry point; the Task42 round-scoped POST
        remains supported for existing consumers. The requester confirmed on
        2026-11-08 that roundId is required in the body. Never choose the first,
        latest, or only open round implicitly. A missing, inactive, or wrong-club
        target returns the same 404 RESOURCE_NOT_FOUND without disclosing the
        other club or round. Both routes share the service transaction and
        uq_applications_round_applicant constraint: using the other route does
        not permit a second application for the same student and round.
        Require a valid SESSION, X-CSRF-TOKEN, ACTIVE account and verified ACTIVE
        student. Committee/Admin callers use Student eligibility, not committee
        privileges. Derive applicant identity from the session and reject
        client identity, status, scores, timestamps, attachment IDs and unknown
        fields at every object level. A suspended account is rejected before
        body parsing and rechecked under the account lock.
        Require an ACTIVE club and its PUBLISHED round with published_at set,
        closed_at IS NULL and opens_at <= now < closes_at. Lock applicant,
        student profile, club, round and current questions using the same order
        as the round route. Read Clock once after the round lock, in UTC.
        Recheck required/blank/duplicate/wrong-round answers, current max lengths,
        and membership eligibility before writing. Only TEXT questions and
        HTTPS document links are supported, using ApplicationSubmissionRequest
        content validation; no options, upload, file IDs or external URL fetch.
        Atomically insert application, answers, links and one NULL -> SUBMITTED
        history with session actor and the same server timestamp. Existing
        applicant/profile data is referenced, not copied or client-editable.
        Reject a prior application in any status, active membership in this
        club, or five effective memberships. Pending applications do not count;
        there is no seat quota. Respond 201 only after commit, or roll back all
        new rows on failure. Lock timeout/deadlock is 503, not duplicate conflict.
