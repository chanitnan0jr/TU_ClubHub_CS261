      x-contract-status: specified-in-task75
      summary: Decline an accepted club membership offer (US-05 / Task69)
      description: >-
        Requires SESSION, X-CSRF-TOKEN, ACTIVE user account, and ownership of
        applicationId (does not require student profile or club to be ACTIVE per
        Permission Matrix section 3). If the application is already DECLINED,
        returns 200 OK with idempotentReplay: true and no writes (T74-D05).
        If already CONFIRMED, returns 409 ALREADY_RESPONDED (no change of mind in MVP).
        For a fresh decline, locks the application row, verifies ACCEPTED status,
        non-cancelled round, and results_published_at <= serverNow < confirmation_deadline
        (T74-D06), then updates status to DECLINED and records history without
        creating a membership.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '90001'
      responses:
        '200':
          description: Membership offer declined (or idempotent replay of an already declined offer)
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
