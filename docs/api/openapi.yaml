    AdminClubStatsPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminClubStatsItem'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId, detail, instance]
      properties:
        type:
          type: string
          format: "uri-reference"
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        reason:
          type: string
          description: >-
            Optional sub-code providing deterministic domain disambiguation for
            409 RESOURCE_CONFLICT responses (e.g., QUESTION_HAS_ANSWERS,
            ROUND_CANCELLED, ROUND_NOT_PUBLISHED, ROUND_STILL_OPEN,
            RESULTS_ALREADY_PUBLISHED, CONFIRMATION_DEADLINE_EXPIRED,
            APPLICATIONS_INCOMPLETE, INVALID_STATUS_TRANSITION, VERSION_MISMATCH,
            ALREADY_RESPONDED, RESULTS_NOT_PUBLISHED, APPLICATION_NOT_ACCEPTED,
            ALREADY_MEMBER, EXISTING_CLUB_MEMBERSHIP, MEMBERSHIP_LIMIT_REACHED).
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    HealthUp:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: UP
    HealthDown:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: DOWN
  responses:
    CommitteeApplicationForbidden:
      description: ACCESS_DENIED without an effective parent club grant, or for cross-club/self-review resources; ACCOUNT_NOT_ALLOWED for suspended accounts
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:access-denied
            title: Access denied
            status: 403
            detail: You are not allowed to access this resource.
            instance: /api/v1/clubs/20001/applications
            code: ACCESS_DENIED
            fieldErrors: []
            traceId: 01J9EXAMPLE7K4D5
    CommitteeApplicationRoundConflict:
      description: Explicitly selected round is DRAFT (ROUND_NOT_PUBLISHED) or CANCELLED (ROUND_CANCELLED)
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [reason]
                properties:
                  status:
                    const: 409
                  code:
                    const: RESOURCE_CONFLICT
                  reason:
                    enum: [ROUND_NOT_PUBLISHED, ROUND_CANCELLED]
          example:
            type: urn:tuclubhub:problem:resource-conflict
            title: Resource state conflict
            status: 409
            detail: The request conflicts with the current resource state.
            instance: /api/v1/clubs/20001/applications
            code: RESOURCE_CONFLICT
