        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishResultsRequest'
            example:
              version: 1
      responses:
