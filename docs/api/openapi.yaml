        Task65 requester confirmed club-scoped reads on 2026-11-08, replacing
        the earlier unimplemented round-scoped GET contract without an alias.
        Requires SESSION and an effective COMMITTEE/PRESIDENT assignment in
        the path club: ACTIVE account, student, club, membership and assignment,
        no revocation, starts_at <= serverNow < ends_at. Global ADMIN alone
        never grants access. Check parent permission before child existence or
        state; a caller without an effective grant receives 403 even when the
