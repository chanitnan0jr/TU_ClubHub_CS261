        (rechecked on every request per Task79). Non-admin users including club
        committee members and presidents without global ADMIN receive 403 ACCESS_DENIED.
        Returns aggregate statistics across all clubs matching the search/category/academicYear/semester
        filters without exposing individual applicant answers or documents, and
        without join double-counting (T74-D08).
      security:
        - SessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring filter on club name.
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
        - name: academicYear
          in: query
          required: false
          description: Filter recruitment round metrics by recruitment_rounds.academic_year.
          schema:
            type: integer
            minimum: 1
            maximum: 32767
          example: 2569
        - name: semester
          in: query
          required: false
          description: Filter recruitment round metrics by recruitment_rounds.semester.
          schema:
            type: integer
            minimum: 1
            maximum: 3
          example: 1
        - name: clubStatus
          in: query
          required: false
          description: Filter clubs by status; defaults to ALL so Admin can view all clubs (US-10.BR-03).
          schema:
            type: string
            enum: [ALL, ACTIVE, INACTIVE]
            default: ALL
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: University-wide aggregate statistics and paginated per-club breakdown
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardStatsResponse'
              example:
