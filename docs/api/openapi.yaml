      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        clubId:
          $ref: '#/components/schemas/PositiveBigintId'
        roundId:
          $ref: '#/components/schemas/PositiveBigintId'
        applicant:
          $ref: '#/components/schemas/CommitteeApplicantIdentity'
        motivation:
          type: string
        questionsWithAnswers:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeQuestionAnswerView'
        links:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeClubDocumentLink'
        status:
          $ref: '#/components/schemas/InternalApplicationStatus'
        submittedAt:
          type: string
          format: date-time
          pattern: 'Z$'
    ApplicantIdentitySummary:
      type: object
      additionalProperties: false
      required: [userId, studentCode, displayName, email, facultyName, departmentName, programName, studyYear]
      description: >-
        Applicant identity projected from users (display_name, email) and
        student_profiles (student_code, faculty_name, department_name,
        program_name, study_year) in V1__init_schema.sql. email is null when
        the TU login did not provide one.
      properties:
        userId:
          type: string
          pattern: '^[0-9]+$'
        studentCode:
          type: string
          maxLength: 20
        displayName:
          type: string
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        facultyName:
          type: [string, 'null']
          maxLength: 200
        departmentName:
          type: [string, 'null']
          maxLength: 200
        programName:
          type: [string, 'null']
          maxLength: 200
        studyYear:
          type: [integer, 'null']
          minimum: 1
          maximum: 10
    CommitteeQuestionAnswerView:
      type: object
      additionalProperties: false
      required: [questionId, questionText, isRequired, displayOrder, answerText]
      description: >-
        Screening question joined with the applicant's text answer
        (application_questions + application_answers). V1 supports text questions
        only; answerText is null when an optional question was left unanswered.
      properties:
        questionId:
          type: string
          pattern: '^[0-9]+$'
        questionText:
          type: string
        isRequired:
          type: boolean
        displayOrder:
          type: integer
          minimum: 1
        answerText:
          type: [string, 'null']
    CommitteeDocumentLinkView:
      type: object
      additionalProperties: false
      required: [id, label, url, displayOrder]
      description: Document link projected from application_links (id, label, url, display_order).
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        label:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        displayOrder:
          type: integer
          minimum: 1
    CommitteeReviewEntry:
      type: object
      additionalProperties: false
      required: [id, reviewerId, reviewerDisplayName, recommendation, internalComment, createdAt, updatedAt, version]
      description: >-
        Internal committee review note projected from application_reviews
        (id, reviewer_id, recommendation, internal_comment, created_at,
        updated_at, version) joined with users.display_name.
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        reviewerId:
          type: string
          pattern: '^[0-9]+$'
        reviewerDisplayName:
          type: string
          maxLength: 200
        recommendation:
          type: string
          enum: [ACCEPT, REJECT, DISCUSS]
          description: Persisted application_reviews.recommendation (NOT NULL in V1__init_schema.sql).
        internalComment:
          type: [string, 'null']
          maxLength: 2000
          description: Persisted application_reviews.internal_comment.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
    CommitteeStatusHistoryEntry:
      type: object
      additionalProperties: false
      required: [fromStatus, toStatus, actorId, reason, changedAt]
      description: >-
        Status transition audit row projected from application_status_history
        (from_status, to_status, actor_id, reason, changed_at).
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/InternalApplicationStatus'
            - type: 'null'
        toStatus:
          $ref: '#/components/schemas/InternalApplicationStatus'
        actorId:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: Null for system-initiated transitions such as background offer expiry.
        reason:
          type: [string, 'null']
        changedAt:
          type: string
          format: date-time
          description: Persisted application_status_history.changed_at timestamp.
    CommitteeApplicationDetail:
      type: object
      additionalProperties: false
      required: [id, clubId, roundId, applicant, motivation, questionsWithAnswers, links, status, resultMessage, decidedBy, decidedAt, respondedAt, version, submittedAt, reviews, statusHistory]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        clubId:
          type: string
          pattern: '^[0-9]+$'
        roundId:
          type: string
          pattern: '^[0-9]+$'
        applicant:
          $ref: '#/components/schemas/ApplicantIdentitySummary'
        motivation:
          type: string
        questionsWithAnswers:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeQuestionAnswerView'
        links:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeDocumentLinkView'
        status:
          $ref: '#/components/schemas/InternalApplicationStatus'
        resultMessage:
          type: [string, 'null']
          maxLength: 1000
        decidedBy:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        decidedAt:
          type: [string, 'null']
          format: date-time
        respondedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 0
        submittedAt:
          type: string
          format: date-time
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeReviewEntry'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeStatusHistoryEntry'
    StartApplicationReviewRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: >-
        Transitions an application from SUBMITTED to UNDER_REVIEW (or updates
        review notes while already in UNDER_REVIEW) before round results are
        published (T74-D02). When recommendation or internalComment is provided,
        recommendation is required because application_reviews.recommendation is
        NOT NULL in V1__init_schema.sql (defaults to DISCUSS when omitted while
        internalComment is present).
      properties:
        recommendation:
          type: [string, 'null']
          enum: [ACCEPT, REJECT, DISCUSS, null]
          description: >-
            Optional committee review recommendation stored in
            application_reviews.recommendation. If internalComment is provided
            and recommendation is omitted/null, the backend defaults
            recommendation to DISCUSS.
        internalComment:
          type: [string, 'null']
          maxLength: 2000
          description: Optional internal review comment stored in application_reviews.internal_comment.
        version:
          type: integer
          minimum: 0
          description: Expected applications.version for optimistic locking.
    ApplicationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, version]
      description: >-
        Records or updates a pre-publication selection decision (ACCEPTED or
        REJECTED) on an application after the round has closed and while
        round.results_published_at is null (T74-D02 / T74-D03). When
        internalNote is non-blank, the backend also upserts the caller's
        application_reviews row (mapping decision ACCEPTED -> recommendation
        ACCEPT and REJECTED -> recommendation REJECT, with internal_comment =
        internalNote).
      properties:
        decision:
          type: string
          enum: [ACCEPTED, REJECTED]
        resultMessage:
          type: [string, 'null']
          maxLength: 1000
          description: >-
            Applicant-facing feedback stored in applications.result_message;
            hidden from the applicant until round.results_published_at is set.
        internalNote:
          type: [string, 'null']
          maxLength: 2000
          description: >-
            Committee-only note stored in application_reviews.internal_comment
            and/or application_status_history.reason; never exposed to applicants.
        version:
          type: integer
          minimum: 0
          description: Expected applications.version for optimistic locking.
    ApplicationDecisionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_PUBLISHED
                - ROUND_STILL_OPEN
                - RESULTS_ALREADY_PUBLISHED
                - INVALID_STATUS_TRANSITION
                - VERSION_MISMATCH
    PublishResultsRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: >-
        Atomically publishes all pre-recorded ACCEPTED and REJECTED decisions
        for a closed recruitment round by setting
        recruitment_rounds.results_published_at = serverNow and queuing outbox
        notifications for all decided applications (T74-D03). The round's
        confirmation_deadline is already stored on recruitment_rounds.
      properties:
        version:
          type: integer
          minimum: 0
          description: Expected recruitment_rounds.version for optimistic locking.
    PublishResultsResponse:
      type: object
      additionalProperties: false
      required: [roundId, clubId, resultsPublishedAt, confirmationDeadline, acceptedCount, rejectedCount, roundVersion]
      properties:
        roundId:
          type: string
          pattern: '^[0-9]+$'
        clubId:
          type: string
          pattern: '^[0-9]+$'
        resultsPublishedAt:
          type: string
          format: date-time
        confirmationDeadline:
          type: string
          format: date-time
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        roundVersion:
          type: integer
          minimum: 0
    PublishResultsConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_PUBLISHED
                - ROUND_STILL_OPEN
                - RESULTS_ALREADY_PUBLISHED
                - CONFIRMATION_DEADLINE_EXPIRED
                - APPLICATIONS_INCOMPLETE
                - VERSION_MISMATCH
    ApplicantClubSummary:
      type: object
      additionalProperties: false
      required: [id, name, imageUrl]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
    ApplicantRoundSummary:
      type: object
      additionalProperties: false
      required: [id, title, academicYear, semester, opensAt, closesAt, resultsPublishedAt, confirmationDeadline]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        title:
          type: string
          maxLength: 200
        academicYear:
          type: integer
          minimum: 2500
          maximum: 2700
        semester:
          type: integer
          enum: [1, 2, 3]
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        resultsPublishedAt:
          type: [string, 'null']
          format: date-time
        confirmationDeadline:
          type: [string, 'null']
          format: date-time
    ApplicantApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, club, round, submittedAt, applicantVisibleStatus, displayStatusLabel, canConfirm, canDecline, respondedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        club:
          $ref: '#/components/schemas/ApplicantClubSummary'
        round:
          $ref: '#/components/schemas/ApplicantRoundSummary'
        submittedAt:
          type: string
          format: date-time
        applicantVisibleStatus:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        displayStatusLabel:
          type: string
          description: Localized Thai status label corresponding to applicantVisibleStatus.
        canConfirm:
          type: boolean
          description: >-
            True ONLY when round.publication_status = 'PUBLISHED',
            round.results_published_at is non-null, internal status is ACCEPTED,
            and round.results_published_at <= serverNow < round.confirmation_deadline
            (strict < per T74-D06).
        canDecline:
          type: boolean
          description: >-
            True ONLY when round.publication_status = 'PUBLISHED',
            round.results_published_at is non-null, internal status is ACCEPTED,
            and round.results_published_at <= serverNow < round.confirmation_deadline
            (strict < per T74-D06).
        respondedAt:
          type: [string, 'null']
          format: date-time
    ApplicantApplicationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantApplicationSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ApplicantDocumentLinkView:
      type: object
      additionalProperties: false
      required: [label, url, displayOrder]
      properties:
        label:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        displayOrder:
          type: integer
          minimum: 1
    ApplicantStatusHistoryEntry:
      type: object
      additionalProperties: false
      description: >-
        Applicant-safe status timeline entry (T74-D04, US-04.BR-04). The server
        builds this timeline instead of copying internal status history, and
        returns entries oldest first. SUBMITTED is dated submitted_at. After
        round.results_published_at is set, one entry carries the published
        result (ACCEPTED_PENDING_CONFIRMATION or REJECTED) dated
        results_published_at. CONFIRMED and DECLINED are dated responded_at,
        EXPIRED is dated round.confirmation_deadline, and WITHDRAWN is dated
        when the withdrawal was recorded. UNDER_REVIEW entries, decisions
        changed before publication, decision times, actor_id, and internal
        reasons are never returned.
      required: [status, displayStatusLabel, occurredAt]
      properties:
        status:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        displayStatusLabel:
          type: string
        occurredAt:
          type: string
          format: date-time
    ApplicantApplicationDetail:
      type: object
      additionalProperties: false
      description: >-
        Applicant-owned application detail projection. Excludes committee
        reviews, internal comments, recommendations, and internal reviewer
        identities (US-04 / T74-D02 / T74-D04).
      required: [id, club, round, motivation, questionsWithAnswers, links, submittedAt, applicantVisibleStatus, displayStatusLabel, resultMessage, canConfirm, canDecline, respondedAt, statusHistory]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        club:
          $ref: '#/components/schemas/ApplicantClubSummary'
        round:
          $ref: '#/components/schemas/ApplicantRoundSummary'
        motivation:
          type: string
        questionsWithAnswers:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeQuestionAnswerView'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantDocumentLinkView'
        submittedAt:
          type: string
          format: date-time
        applicantVisibleStatus:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        displayStatusLabel:
          type: string
        resultMessage:
          type: [string, 'null']
          description: Null while round.results_published_at is null.
        canConfirm:
          type: boolean
        canDecline:
          type: boolean
        respondedAt:
          type: [string, 'null']
          format: date-time
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantStatusHistoryEntry'
    MembershipOfferResponse:
      type: object
      additionalProperties: false
      required: [applicationId, clubId, roundId, status, displayStatusLabel, respondedAt, membershipId, idempotentReplay]
      properties:
        applicationId:
          type: string
          pattern: '^[0-9]+$'
        clubId:
          type: string
          pattern: '^[0-9]+$'
        roundId:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [CONFIRMED, DECLINED]
        displayStatusLabel:
          type: string
        respondedAt:
          type: string
          format: date-time
        membershipId:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: Present when status is CONFIRMED (the created club_memberships.id); null when status is DECLINED.
        idempotentReplay:
          type: boolean
          description: >-
            False on the initial transition from ACCEPTED; true when a retry of
            the same action (confirm on CONFIRMED or decline on DECLINED) is
            replayed idempotently (T74-D05).
    MembershipOfferConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ALREADY_RESPONDED
                - CONFIRMATION_DEADLINE_EXPIRED
                - ROUND_CANCELLED
                - RESULTS_NOT_PUBLISHED
                - APPLICATION_NOT_ACCEPTED
                - EXISTING_CLUB_MEMBERSHIP
                - MEMBERSHIP_LIMIT_REACHED
    AdminDashboardStatsResponse:
      type: object
      additionalProperties: false
      description: >-
        University-wide aggregate statistics and paginated per-club breakdown
        for system administrators (US-10 / Task69 / T74-D08 — metric definitions
        proposed in Task75, pending PO/Reviewer sign-off).
      required: [generatedAt, filters, summary, categoryBreakdown, topClubs, clubs]
      properties:
        generatedAt:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/AdminDashboardAppliedFilters'
        summary:
          $ref: '#/components/schemas/AdminDashboardSummaryMetrics'
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategoryStatsItem'
        topClubs:
          type: array
          items:
            $ref: '#/components/schemas/AdminTopClubItem'
        clubs:
          $ref: '#/components/schemas/AdminClubStatsPage'
    AdminDashboardAppliedFilters:
      type: object
      additionalProperties: false
      required: [academicYear, semester, categoryId, clubStatus]
      properties:
        academicYear:
          type: [integer, 'null']
          minimum: 1
          maximum: 32767
        semester:
          type: [integer, 'null']
          enum: [1, 2, 3, null]
        categoryId:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        clubStatus:
          type: string
          enum: [ACTIVE, INACTIVE, ALL]
    AdminDashboardSummaryMetrics:
      type: object
      additionalProperties: false
      required: [totalClubs, activeClubs, inactiveClubs, clubsCurrentlyRecruiting, totalRecruitmentRounds, openRecruitmentRounds, totalApplications, uniqueApplicants, confirmedNewMembers, currentActiveMemberships, confirmationRatePercent, statusBreakdown]
      properties:
        totalClubs:
          type: integer
          minimum: 0
        activeClubs:
          type: integer
          minimum: 0
        inactiveClubs:
          type: integer
          minimum: 0
        clubsCurrentlyRecruiting:
          type: integer
          minimum: 0
        totalRecruitmentRounds:
          type: integer
          minimum: 0
        openRecruitmentRounds:
          type: integer
          minimum: 0
        totalApplications:
          type: integer
          minimum: 0
        uniqueApplicants:
          type: integer
          minimum: 0
        confirmedNewMembers:
          type: integer
          minimum: 0
        currentActiveMemberships:
          type: integer
          minimum: 0
        confirmationRatePercent:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Percentage of published offers that were confirmed:
            ROUND(100.0 * confirmedCount / NULLIF(acceptedCount + confirmedCount + declinedCount + expiredCount, 0), 2),
            or 0.0 when the denominator is 0.
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of InternalApplicationStatus keys to aggregate counts.
