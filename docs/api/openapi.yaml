      description: >-
        Publishes all pre-recorded ACCEPTED and REJECTED decisions for a closed round
        and sets confirmation_deadline_at on all ACCEPTED applications in the round
        (S2-PUBLICATION-DRAFT / T74-D02).
      properties:
        confirmationDeadlineAt:
          type: string
          format: date-time
          description: >-
            Must be strictly after the server's current UTC timestamp (publishedAt)
            and strictly after round.closesAt.
    PublishResultsResponse:
      type: object
      additionalProperties: false
      required: [roundId, status, resultsPublishedAt, resultsPublishedByUserId, confirmationDeadlineAt, totalApplications, acceptedCount, rejectedCount]
      properties:
        roundId:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          const: CLOSED
        resultsPublishedAt:
          type: string
          format: date-time
        resultsPublishedByUserId:
          type: string
          pattern: '^[0-9]+$'
        confirmationDeadlineAt:
          type: string
          format: date-time
        totalApplications:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
    PublishResultsConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_NOT_CLOSED
                - RESULTS_ALREADY_PUBLISHED
                - UNDECIDED_APPLICATIONS_REMAIN
    ApplicantClubSummary:
      type: object
      additionalProperties: false
      required: [id, name, imageUrl, categoryName]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        categoryName:
          type: [string, 'null']
          maxLength: 100
    ApplicantRoundSummary:
      type: object
      additionalProperties: false
      required: [id, title, status, opensAt, closesAt, closedAt, resultsPublishedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        title:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [PUBLISHED, CLOSED, CANCELLED]
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        resultsPublishedAt:
          type: [string, 'null']
          format: date-time
    ApplicantApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, club, round, status, resultsPublished, canConfirmOffer, canDeclineOffer, submittedAt, confirmationDeadlineAt, confirmedAt, declinedAt, expiredAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        club:
          $ref: '#/components/schemas/ApplicantClubSummary'
        round:
          $ref: '#/components/schemas/ApplicantRoundSummary'
        status:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        resultsPublished:
          type: boolean
          description: True when round.resultsPublishedAt is non-null.
        canConfirmOffer:
          type: boolean
          description: >-
            True only when resultsPublished is true, status is ACCEPTED, and the
            current server UTC time is less than or equal to confirmationDeadlineAt.
        canDeclineOffer:
          type: boolean
          description: >-
            True only when resultsPublished is true, status is ACCEPTED, and the
            current server UTC time is less than or equal to confirmationDeadlineAt.
        submittedAt:
          type: string
          format: date-time
        confirmationDeadlineAt:
          type: [string, 'null']
          format: date-time
          description: Masked as null while resultsPublished is false.
        confirmedAt:
          type: [string, 'null']
          format: date-time
        declinedAt:
          type: [string, 'null']
          format: date-time
        expiredAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicantApplicationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantApplicationSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ApplicantDocumentLinkView:
      type: object
      additionalProperties: false
      required: [id, documentType, title, url]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        documentType:
          type: string
          enum: [PORTFOLIO, RESUME, TRANSCRIPT, OTHER]
        title:
          type: string
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
    ApplicantStatusHistoryEntry:
      type: object
      additionalProperties: false
      description: >-
        Applicant-safe status timeline entry. Pre-publication ACCEPTED/REJECTED
        draft transitions are masked or coalesced into UNDER_REVIEW until
        round.resultsPublishedAt is set, and changedByUserId / internal committee
        reasons are never exposed.
      required: [status, occurredAt, label]
      properties:
        status:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        occurredAt:
          type: string
          format: date-time
        label:
          type: string
    ApplicantApplicationDetail:
      type: object
      additionalProperties: false
      description: >-
        Applicant-owned application detail projection. Excludes committee reviewNotes,
        scores, and internal reviewer identities (US-04 / T74-D02).
      required: [id, club, round, status, resultsPublished, canConfirmOffer, canDeclineOffer, applicantNote, submittedAt, confirmationDeadlineAt, confirmedAt, declinedAt, expiredAt, answers, documentLinks, statusTimeline, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        club:
          $ref: '#/components/schemas/ApplicantClubSummary'
        round:
          $ref: '#/components/schemas/ApplicantRoundSummary'
        status:
          $ref: '#/components/schemas/ApplicantVisibleStatus'
        resultsPublished:
          type: boolean
        canConfirmOffer:
          type: boolean
        canDeclineOffer:
          type: boolean
        applicantNote:
          type: [string, 'null']
        submittedAt:
          type: string
          format: date-time
        confirmationDeadlineAt:
          type: [string, 'null']
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        declinedAt:
          type: [string, 'null']
          format: date-time
        expiredAt:
          type: [string, 'null']
          format: date-time
        answers:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeQuestionAnswerView'
        documentLinks:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantDocumentLinkView'
        statusTimeline:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantStatusHistoryEntry'
        updatedAt:
          type: string
          format: date-time
    MembershipOfferResponse:
      type: object
      additionalProperties: false
      required: [applicationId, clubId, roundId, status, confirmedAt, declinedAt, clubMembershipId, membershipStatus]
      properties:
        applicationId:
          type: string
          pattern: '^[0-9]+$'
        clubId:
          type: string
          pattern: '^[0-9]+$'
        roundId:
          type: string
          pattern: '^[0-9]+$'
        status:
          type: string
          enum: [CONFIRMED, DECLINED]
        confirmedAt:
          type: [string, 'null']
          format: date-time
        declinedAt:
          type: [string, 'null']
          format: date-time
        clubMembershipId:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: Present when status is CONFIRMED and club_memberships row is created/activated.
        membershipStatus:
          type: [string, 'null']
          enum: [ACTIVE, null]
    MembershipOfferConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - OFFER_NOT_AVAILABLE
                - OFFER_EXPIRED
                - ALREADY_CLUB_MEMBER
                - CLUB_INACTIVE
                - STUDENT_NOT_ACTIVE
                - INVALID_STATUS_TRANSITION
    AdminDashboardStatsResponse:
      type: object
      additionalProperties: false
      required: [generatedAt, filters, summary, applicationsByCategory, topClubsByApplications, clubStats]
      properties:
        generatedAt:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/AdminDashboardAppliedFilters'
        summary:
          $ref: '#/components/schemas/AdminDashboardSummaryMetrics'
        applicationsByCategory:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategoryStatsItem'
        topClubsByApplications:
          type: array
          items:
            $ref: '#/components/schemas/AdminTopClubItem'
        clubStats:
          $ref: '#/components/schemas/AdminClubStatsPage'
    AdminDashboardAppliedFilters:
      type: object
      additionalProperties: false
      required: [academicYear, semester, categoryId, clubStatus]
      properties:
        academicYear:
          type: [integer, 'null']
        semester:
          type: [string, 'null']
          enum: ['1', '2', '3', 'SUMMER', null]
        categoryId:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        clubStatus:
          type: string
          enum: [ACTIVE, INACTIVE, ALL]
    AdminDashboardSummaryMetrics:
      type: object
      additionalProperties: false
      required: [totalClubs, activeClubs, inactiveClubs, clubsCurrentlyRecruiting, totalRecruitmentRounds, openRecruitmentRounds, totalApplications, statusBreakdown, activeMembershipsCount]
      properties:
        totalClubs:
          type: integer
          minimum: 0
        activeClubs:
          type: integer
          minimum: 0
        inactiveClubs:
          type: integer
          minimum: 0
        clubsCurrentlyRecruiting:
          type: integer
          minimum: 0
        totalRecruitmentRounds:
          type: integer
          minimum: 0
        openRecruitmentRounds:
          type: integer
          minimum: 0
        totalApplications:
          type: integer
          minimum: 0
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of InternalApplicationStatus keys to aggregate counts.
        activeMembershipsCount:
          type: integer
          minimum: 0
    AdminCategoryStatsItem:
      type: object
      additionalProperties: false
      required: [categoryId, categoryName, clubCount, totalApplications, confirmedApplications, activeMembersCount]
      properties:
        categoryId:
          type: string
          pattern: '^[0-9]+$'
        categoryName:
          type: string
        clubCount:
          type: integer
          minimum: 0
        totalApplications:
          type: integer
          minimum: 0
        confirmedApplications:
          type: integer
          minimum: 0
        activeMembersCount:
          type: integer
          minimum: 0
    AdminTopClubItem:
      type: object
      additionalProperties: false
      required: [clubId, clubName, categoryName, totalApplications, acceptedApplications, confirmedApplications, activeMembersCount]
      properties:
        clubId:
          type: string
          pattern: '^[0-9]+$'
        clubName:
          type: string
        categoryName:
          type: string
        totalApplications:
          type: integer
          minimum: 0
        acceptedApplications:
          type: integer
          minimum: 0
        confirmedApplications:
          type: integer
          minimum: 0
        activeMembersCount:
          type: integer
          minimum: 0
    AdminClubStatsItem:
      type: object
      additionalProperties: false
      required: [clubId, clubName, categoryId, categoryName, status, totalRounds, openRounds, totalApplications, submittedCount, underReviewCount, acceptedCount, rejectedCount, confirmedCount, declinedCount, expiredCount, activeMembersCount]
      properties:
        clubId:
          type: string
          pattern: '^[0-9]+$'
        clubName:
          type: string
        categoryId:
          type: string
          pattern: '^[0-9]+$'
        categoryName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        totalRounds:
          type: integer
          minimum: 0
        openRounds:
          type: integer
          minimum: 0
        totalApplications:
          type: integer
          minimum: 0
        submittedCount:
          type: integer
          minimum: 0
        underReviewCount:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        confirmedCount:
          type: integer
          minimum: 0
        declinedCount:
          type: integer
          minimum: 0
        expiredCount:
          type: integer
          minimum: 0
        activeMembersCount:
          type: integer
          minimum: 0
    AdminClubStatsPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminClubStatsItem'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        reason:
          type: string
          description: >-
            Optional sub-code providing deterministic domain disambiguation for
            409 RESOURCE_CONFLICT responses (e.g., QUESTION_HAS_ANSWERS,
            ROUND_NOT_CLOSED, RESULTS_ALREADY_PUBLISHED, UNDECIDED_APPLICATIONS_REMAIN,
            OFFER_EXPIRED, ALREADY_CLUB_MEMBER).
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    HealthUp:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: UP
    HealthDown:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: DOWN
  responses:
    InvalidResourceId:
      description: The id is not a valid decimal bigint identifier or is out of range
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:invalid-resource-id
            title: Invalid resource identifier
            status: 400
            detail: id must contain decimal digits and fit a positive signed 64-bit integer.
            instance: /api/v1/public/clubs/abc
            code: INVALID_RESOURCE_ID
            traceId: 01J9EXAMPLE7K4D5
    PublicClubNotFound:
      description: No active public club exists for this identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:club-not-found
            title: Club not found
            status: 404
            detail: No public club was found for this identifier.
            instance: /api/v1/public/clubs/20001
            code: CLUB_NOT_FOUND
            traceId: 01J9EXAMPLE7K4D5
    ValidationError:
      description: Request body is malformed or fails validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:validation-error
            title: Request validation failed
            status: 400
            detail: One or more request fields are invalid.
            instance: /api/v1/auth/login
            code: VALIDATION_FAILED
            fieldErrors:
              - field: username
                code: REQUIRED
                message: Username is required.
            traceId: 01J9EXAMPLE7K4D5
    AccountNotAllowed:
      description: Current account is suspended; invalidate its session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:account-not-allowed
            title: Account not allowed
            status: 403
            detail: This account is not allowed to use TU-ClubHub.
            instance: /api/v1/auth/me
            code: ACCOUNT_NOT_ALLOWED
            traceId: 01J9EXAMPLE7K4D5
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:authentication-required
            title: Authentication required
            status: 401
            detail: Sign in to access this resource.
            instance: /api/v1/auth/me
            code: AUTHENTICATION_REQUIRED
            traceId: 01J9EXAMPLE7K4D5
    Forbidden:
      description: >-
        ACCESS_DENIED when an authenticated caller lacks permission to an existing
        private resource; CSRF_INVALID when the CSRF token is invalid. T74-D01's
        user-recorded 2026-10-27 target policy uses 403 for existing unauthorized
        private resources, not the former 404 hiding rule; nonexistent uses 404.
        This does not change the separate public/availability endpoint exceptions
        or imply that missing application workflow handlers are implemented.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:csrf-invalid
            title: Request rejected
            status: 403
            detail: The CSRF token is missing or invalid.
            instance: /api/v1/auth/logout
            code: CSRF_INVALID
            traceId: 01J9EXAMPLE7K4D5
    MethodNotAllowed:
      description: The request method is not supported for this path
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:method-not-allowed
            title: Method not allowed
            status: 405
            detail: The request method is not supported for this resource.
            instance: /api/v1/clubs/20001
            code: METHOD_NOT_ALLOWED
            traceId: 01J9EXAMPLE7K4D5
    ServiceUnavailable:
      description: A required dependency, such as the database, is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:service-unavailable
            title: Service unavailable
            status: 503
            detail: The request could not be completed because a required service is unavailable.
            instance: /api/v1/clubs/20001
            code: SERVICE_UNAVAILABLE
            traceId: 01J9EXAMPLE7K4D5
    ServerError:
      description: Unexpected API failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:internal-error
            title: Internal server error
            status: 500
            detail: The request could not be completed.
            instance: /api/v1/resource
            code: INTERNAL_ERROR
            traceId: 01J9EXAMPLE7K4D5
