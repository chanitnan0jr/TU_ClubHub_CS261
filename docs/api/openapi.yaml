    MembershipOfferResponse:
      type: object
      additionalProperties: false
      required: [applicationId, clubId, roundId, status, displayStatusLabel, respondedAt, membershipId, idempotentReplay]
      properties:
        applicationId:
          type: string
          pattern: '^[0-9]+$'
