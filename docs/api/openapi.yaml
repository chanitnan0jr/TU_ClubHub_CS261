                roundId: '70001'
                status: DECLINED
                displayStatusLabel: สละสิทธิ์
                respondedAt: '2026-10-28T04:20:00Z'
                membershipId: null
                idempotentReplay: false
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Application does not exist (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Offer expired, results not published, or already confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MembershipOfferConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
