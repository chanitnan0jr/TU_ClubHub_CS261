openapi: 3.1.0
info:
  title: TU-ClubHub API
  version: 1.1.0
  description: >-
    TU-ClubHub API contract for foundation, public club profiles, and application
    submission. The application submission contract is defined; implementation is pending.
    Source status reviewed on 2026-10-19: auth, public club reads, club profile PUT,
    and health have handlers. GET /api/v1/clubs/{clubId} remains contract-only.
    Recruitment management is specified separately in rounds.openapi.yaml.
    Handler presence does not imply complete frontend or permission-policy integration.
    Additional product workflow endpoints are tracked in docs/api/API_v1.md and
    must be specified before implementation.
    Authorization policy adopted on 2026-10-19 is defined in the
    [Permission Matrix](../security/permission-matrix.md), including Active status,
    committee terms, self-review restrictions, and remaining enforcement work.
servers:
  - url: /
    description: Same-origin application server
tags:
  - name: Authentication
  - name: Clubs
  - name: Public Clubs
  - name: Applications
    description: Student application submission (US-03). Application history and review APIs are not defined yet.
  - name: Operations
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      x-implementation-status: implemented
      summary: Get a CSRF token for the browser session
      description: Returns an opaque token and the request header name. Response must not be cached.
      security: []
      responses:
        '200':
          description: CSRF token created or loaded for the current session
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Server-side session cookie; HttpOnly, Secure on HTTPS, SameSite=Lax, Path=/.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              example:
                headerName: X-CSRF-TOKEN
                token: opaque-token-value
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-implementation-status: implemented
      summary: Authenticate through the configured TU adapter
      description: >-
        Requires the CSRF header returned by /api/v1/auth/csrf. The public request
        uses username and password. The adapter maps these to the TU Authentication
        API's documented UserName and PassWord fields. On successful TU verification,
        the backend creates or refreshes the local user account, rotates the session
        ID, and saves the authenticated security context in the JDBC session. The
        session expires after 30 minutes of inactivity or 8 hours after successful
        login, whichever comes first. A fresh CSRF token for the new session is
        returned in the response body.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: student-id-or-account-name
              password: user-entered-password
      responses:
        '200':
          description: Authenticated; a rotated session cookie is set and a fresh CSRF token is returned
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Rotated server-side session cookie. Never expose the session ID in JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  id: '10001'
                  role: USER
                csrf:
                  headerName: X-CSRF-TOKEN
                  token: opaque-token-value
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credentials could not be verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:authentication-failed
                title: Authentication failed
                status: 401
                detail: The supplied credentials could not be verified.
                instance: /api/v1/auth/login
                code: AUTHENTICATION_FAILED
                traceId: 01J9EXAMPLE7K4D5
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: TU Authentication API is unavailable or returned an unusable response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:auth-provider-unavailable
                title: Authentication provider unavailable
                status: 503
                detail: Authentication is temporarily unavailable.
                instance: /api/v1/auth/login
                code: AUTH_PROVIDER_UNAVAILABLE
                traceId: 01J9EXAMPLE7K4D5
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      x-implementation-status: implemented
      summary: Get the authenticated user's minimal account identity
      description: >-
        The role is for UI presentation only; the backend rechecks authorization for
        every request. Expired sessions return 401 AUTHENTICATION_REQUIRED.
        The adopted policy requires a current ACTIVE account and the current
        database global role. A suspended account returns 403 ACCOUNT_NOT_ALLOWED
        and its session is invalidated. The permission matrix records the
        remaining account and role revalidation implementation work.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated user
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              example:
                user:
                  id: '10001'
                  role: USER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountNotAllowed'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-implementation-status: implemented
      summary: Invalidate the current session
      description: Requires both the authenticated session cookie and the current CSRF header.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated and session cookie cleared
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/clubs/{id}:
    get:
      tags: [Public Clubs]
      operationId: getPublicClubProfile
      x-implementation-status: implemented
      summary: Get an active club's public profile
      description: >-
        Public endpoint; authentication is not required. Returns only an ACTIVE
        club. If the club does not exist or is inactive, return the same 404
        response so its non-public existence is not disclosed. Only the explicitly
        listed public profile fields and safe category/tag summaries may be exposed.
        Database bigint identifiers are decimal strings on the wire. The id path
        value must contain decimal digits and fit a positive signed 64-bit integer.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Decimal string for a positive database bigint club identifier.
          schema:
            type: string
            pattern: '^[0-9]+$'
            maxLength: 19
          example: '20001'
      responses:
        '200':
          description: Active club public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClubProfile'
              example:
                id: '20001'
                name: Example Club
                description: A student club at Thammasat University.
                objectives: Help students learn and collaborate.
                contactUrl: https://example.org/contact
                facebookUrl: null
                instagramUrl: null
                contactEmail: club@example.org
                affiliationLevel: University
                affiliationName: Thammasat University
                imageUrl: https://images.example.org/clubs/20001.png
                bannerUrl: null
                category:
                  id: '30001'
                  name: Technology
                tags:
                  - id: '40001'
                    name: Programming
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '404':
          $ref: '#/components/responses/PublicClubNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/clubs/{id}/recruitment-rounds:
    get:
      tags: [Public Clubs]
      operationId: listOpenPublicClubRecruitmentRounds
      x-implementation-status: implemented
      summary: List currently open public recruitment rounds for an active club
      description: >-
        Public endpoint; authentication is not required. The parent club must be
        ACTIVE or the endpoint returns the same 404 response as for an unknown club.
        Include only rounds with publicationStatus PUBLISHED, opensAt <= the
        evaluation instant < closesAt, and closedAt unset. The start is inclusive;
        the scheduled close is exclusive. Database timestamps are timestamptz
        instants and response timestamps are serialized as ISO 8601 UTC with Z.
        The implementation uses one backend Clock.instant() for the page query
        and total count. Deployed hosts must keep their clocks synchronized;
        no clock-skew allowance is defined.
        The response uses the API's standard paginated collection wrapper; an
        active club with no qualifying rounds returns 200 with items: [] and zero
        totals.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Decimal string for a positive database bigint club identifier.
          schema:
            type: string
            pattern: '^[0-9]+$'
            maxLength: 19
          example: '20001'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of rounds per page; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Currently open public rounds for the active club; may be empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRecruitmentRoundPage'
              examples:
                roundsAvailable:
                  summary: At least one published round is currently open
                  value:
                    items:
                      - id: '50001'
                        name: Academic Year 2026
                        opensAt: '2026-10-01T00:00:00Z'
                        closesAt: '2026-10-31T16:59:59Z'
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                noRoundsAvailable:
                  summary: Active club has no rounds in the current open window
                  value:
                    items: []
                    page:
                      number: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '404':
          $ref: '#/components/responses/PublicClubNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/clubs/{clubId}:
    get:
      tags: [Clubs]
      operationId: getClub
      x-implementation-status: pending
      summary: Get public club details
      description: >-
        Contract-only; no backend handler. The editor client currently calls this
        path; implemented public reads use /api/v1/public/clubs/{id} and its
        recruitment-rounds collection with different DTOs.
        Public endpoint. Only published recruitment rounds and public profile fields
        may be returned. Inactive clubs, draft rounds, applicant data, committee-only
        information, and internal notes are not returned. IDs are decimal strings on
        the wire even when stored as database bigint values.
      security: []
      parameters:
        - name: clubId
          in: path
          required: true
          description: Decimal string identifier for a club
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: '20001'
      responses:
        '200':
          description: Public club detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDetail'
              example:
                id: '20001'
                categoryId: '30001'
                name: Example Club
                description: A student club at Thammasat University.
                objectives: Help students learn and collaborate.
                contactUrl: https://example.org/contact
                facebookUrl: null
                instagramUrl: null
                contactEmail: club@example.org
                affiliationLevel: University
                affiliationName: Thammasat University
                imageUrl: https://images.example.org/clubs/20001.png
                bannerUrl: null
                status: ACTIVE
                category:
                  id: '30001'
                  name: Technology
                tags:
                  - id: '40001'
                    name: Programming
                recruitmentRounds:
                  - id: '50001'
                    name: Academic Year 2026
                    opensAt: '2026-10-01T00:00:00Z'
                    closesAt: '2026-10-31T16:59:59Z'
                    closedAt: null
        '400':
          description: Invalid club identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:invalid-resource-id
                title: Invalid resource identifier
                status: 400
                detail: clubId must be a decimal string.
                instance: /api/v1/clubs/abc
                code: INVALID_RESOURCE_ID
                traceId: 01J9EXAMPLE7K4D5
        '404':
          description: Club does not exist or is not public
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:club-not-found
                title: Club not found
                status: 404
                detail: No public club was found for this identifier.
                instance: /api/v1/clubs/20001
                code: CLUB_NOT_FOUND
                traceId: 01J9EXAMPLE7K4D5
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Clubs]
      operationId: updateClub
      x-implementation-status: implemented
      summary: Update a club profile
      description: >-
        Replaces the editable club profile fields. Requires an authenticated session,
        the current CSRF header, and an effective COMMITTEE or PRESIDENT assignment
        for this club. The adopted policy requires ACTIVE account, student profile,
        club, membership, and assignment; membership joined_at <= now and
        ended_at IS NULL; assignment revoked_at IS NULL and starts_at <= now < ends_at.
        The start is inclusive and the end exclusive, using backend UTC time.
        Check current database state on every request and inside the write transaction.
        ADMIN alone grants no access. The permission matrix records guard additions
        still required in the implementation.
        Only name, description, objectives, contact/social URLs, contactEmail,
        imageUrl, and bannerUrl are writable. Category, affiliation, status, tags,
        and recruitment rounds are read-only through this operation. Omitted or null
        nullable request fields are cleared. URL fields must use HTTPS.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: clubId
          in: path
          required: true
          description: Decimal string identifier for a club
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: '20001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubUpdateRequest'
            example:
              name: TU Coding Club Updated
              description: A club for programming enthusiasts.
              objectives: Learn and share coding skills.
              contactUrl: https://example.org/contact
              facebookUrl: null
              instagramUrl: https://instagram.com/tucoding
              contactEmail: tucoding@example.org
              imageUrl: https://images.example.org/clubs/20001.png
              bannerUrl: null
      responses:
        '200':
          description: Club profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDetail'
              example:
                id: '20001'
                categoryId: '30001'
                name: TU Coding Club Updated
                description: A club for programming enthusiasts.
                objectives: Learn and share coding skills.
                contactUrl: https://example.org/contact
                facebookUrl: null
                instagramUrl: https://instagram.com/tucoding
                contactEmail: tucoding@example.org
                affiliationLevel: University
                affiliationName: Thammasat University
                imageUrl: https://images.example.org/clubs/20001.png
                bannerUrl: null
                status: ACTIVE
                category:
                  id: '30001'
                  name: Technology
                tags: []
                recruitmentRounds: []
        '400':
          description: Invalid club identifier or request fields failed validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: One or more request fields are invalid
                  value:
                    type: urn:tuclubhub:problem:validation-error
                    title: Request validation failed
                    status: 400
                    detail: One or more request fields are invalid.
                    instance: /api/v1/clubs/20001
                    code: VALIDATION_FAILED
                    fieldErrors:
                      - field: name
                        code: REQUIRED
                        message: Club name is required.
                    traceId: 01J9EXAMPLE7K4D5
                invalidId:
                  summary: Club ID is not a decimal string
                  value:
                    type: urn:tuclubhub:problem:invalid-resource-id
                    title: Invalid resource identifier
                    status: 400
                    detail: clubId must be a decimal string.
                    instance: /api/v1/clubs/abc
                    code: INVALID_RESOURCE_ID
                    traceId: 01J9EXAMPLE7K4D5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Active or term requirements fail (ACCESS_DENIED), account is suspended (ACCOUNT_NOT_ALLOWED), or CSRF check failed (CSRF_INVALID)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accessDenied:
                  summary: Caller does not have an active assignment for this club and term
                  value:
                    type: urn:tuclubhub:problem:access-denied
                    title: Access denied
                    status: 403
                    detail: You are not allowed to update this club.
                    instance: /api/v1/clubs/20001
                    code: ACCESS_DENIED
                    traceId: 01J9EXAMPLE7K4D5
                accountNotAllowed:
                  summary: Current account is suspended; invalidate its session
                  value:
                    type: urn:tuclubhub:problem:account-not-allowed
                    title: Account not allowed
                    status: 403
                    detail: This account is not allowed to use TU-ClubHub.
                    instance: /api/v1/clubs/20001
                    code: ACCOUNT_NOT_ALLOWED
                    traceId: 01J9EXAMPLE7K4D5
                csrfInvalid:
                  summary: CSRF token is missing, expired, or invalid
                  value:
                    type: urn:tuclubhub:problem:csrf-invalid
                    title: Request rejected
                    status: 403
                    detail: The CSRF token is missing or invalid.
                    instance: /api/v1/clubs/20001
                    code: CSRF_INVALID
                    traceId: 01J9EXAMPLE7K4D5
        '404':
          description: Club does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:club-not-found
                title: Club not found
                status: 404
                detail: No club was found for this identifier.
                instance: /api/v1/clubs/9999
                code: CLUB_NOT_FOUND
                traceId: 01J9EXAMPLE7K4D5
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/clubs/{clubId}/rounds/{roundId}/applications:
    post:
      tags: [Applications]
      operationId: submitApplication
      summary: Submit the current student's application with answers and document links
      x-implementation-status: pending
      description: >-
        Contract defined in API_v1.md section 11; implementation is pending.
        Requires an ACTIVE account, verified ACTIVE student profile, and ACTIVE
        target club; an inactive club returns 404 like a missing one.
        Committee/Admin callers use the same Student permissions;
        no committee assignment or term is required. Derive the applicant from
        the session and club from the round; reject unknown request fields.
        The round must belong to clubId, be PUBLISHED with published_at set,
        satisfy opens_at <= now < closes_at, and have closed_at IS NULL.
        Recheck authorization, eligibility, questions, and round state inside
        one transaction. Serialize with round close/cancel using the same round
        row lock, sample backend UTC time after locking, then persist the
        application, answers, links, and initial status history atomically.
        Respond only after commit. Use uq_applications_round_applicant as the
        final duplicate safeguard; a repeated POST conflicts rather than
        updating or replaying an application, including a withdrawn one.
        Reject existing effective membership in the target club or membership
        in five distinct locally recorded clubs across all club types.
        Effective membership means ACTIVE, joined_at <= now, and ended_at IS NULL.
        Pending applications do not count; there is no separate pending-application
        quota. Submission creates no membership. Confirmation rechecks the limit.
        Store URLs without fetching them or accepting file uploads.
        All responses use Cache-Control no-store. No numeric rate limit is set;
        a future limiter must document its thresholds and the shared 429 policy.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '20001'
        - name: roundId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSubmissionRequest'
            example:
              motivation: I would like to help organize club activities.
              answers:
                - questionId: '81001'
                  answerText: I have organized student workshops.
              links:
                - label: Portfolio
                  url: https://example.org/portfolio
                - label: Resume
                  url: https://example.org/resume.pdf
      responses:
        '201':
          description: Application, answers, links, and initial status history committed
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              description: >-
                Applicant-facing URI of the created application. US-04 implements
                GET at this URI and the applicant's list at /api/v1/me/applications.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/me/applications/90001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmission'
              example:
                id: '90001'
                clubId: '20001'
                roundId: '70001'
                status: SUBMITTED
                submittedAt: '2026-10-19T09:30:00Z'
        '400':
          description: >-
            INVALID_RESOURCE_ID for invalid/out-of-range path IDs;
            VALIDATION_FAILED for malformed JSON, unknown fields, invalid or
            missing answers/links, duplicate question IDs, or questions outside
            this round. Field errors use indexed paths such as links[0].url.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: A document link is not a valid HTTPS URL
                  value:
                    type: urn:tuclubhub:problem:validation-error
                    title: Request validation failed
                    status: 400
                    detail: One or more application fields are invalid.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: VALIDATION_FAILED
                    fieldErrors:
                      - field: links[0].url
                        code: INVALID_HTTPS_URL
                        message: Use an absolute HTTPS URL with a host and no userinfo or whitespace.
                    traceId: 01J9EXAMPLE7K4D5
                invalidResourceId:
                  summary: A path ID is not a positive decimal bigint
                  value:
                    type: urn:tuclubhub:problem:invalid-resource-id
                    title: Invalid resource identifier
                    status: 400
                    detail: roundId must be a positive decimal integer that fits a signed 64-bit value.
                    instance: /api/v1/clubs/20001/rounds/abc/applications
                    code: INVALID_RESOURCE_ID
                    traceId: 01J9EXAMPLE7K4D5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            ACCOUNT_NOT_ALLOWED for a suspended account (invalidate its session);
            ACCESS_DENIED for missing verified ACTIVE student status;
            CSRF_INVALID for a missing/invalid CSRF token.
            CSRF rejection may precede authentication checks.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accessDenied:
                  summary: No verified ACTIVE student profile
                  value:
                    type: urn:tuclubhub:problem:access-denied
                    title: Access denied
                    status: 403
                    detail: An active verified student profile is required to apply.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: ACCESS_DENIED
                    traceId: 01J9EXAMPLE7K4D5
                accountNotAllowed:
                  summary: Current account is suspended; invalidate its session
                  value:
                    type: urn:tuclubhub:problem:account-not-allowed
                    title: Account not allowed
                    status: 403
                    detail: This account is not allowed to use TU-ClubHub.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: ACCOUNT_NOT_ALLOWED
                    traceId: 01J9EXAMPLE7K4D5
                csrfInvalid:
                  summary: CSRF token is missing or invalid
                  value:
                    type: urn:tuclubhub:problem:csrf-invalid
                    title: Request rejected
                    status: 403
                    detail: The CSRF token is missing or invalid.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: CSRF_INVALID
                    traceId: 01J9EXAMPLE7K4D5
        '404':
          description: >-
            RESOURCE_NOT_FOUND when the club is missing or not ACTIVE, the round
            is missing or does not belong to clubId, or the round has never been
            published (published_at IS NULL). Do not reveal whether an inactive
            club or an unpublished round exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-not-found
                title: Resource not found
                status: 404
                detail: No published recruitment round was found at this path.
                instance: /api/v1/clubs/20001/rounds/70001/applications
                code: RESOURCE_NOT_FOUND
                traceId: 01J9EXAMPLE7K4D5
        '409':
          description: >-
            RESOURCE_CONFLICT with a required reason. After authorization and
            visibility checks, check cancellation, not-yet-open, closed,
            duplicate application, existing target-club membership, then the
            five-club membership limit in that order. Preserve the existing
            application and roll back all new rows on a duplicate conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmissionConflict'
              examples:
                roundCancelled:
                  summary: The round was cancelled
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: This recruitment round has been cancelled.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_CANCELLED
                    traceId: 01J9EXAMPLE7K4D5
                roundNotOpen:
                  summary: The round has not opened yet
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: This recruitment round is not open for applications yet.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_NOT_OPEN
                    traceId: 01J9EXAMPLE7K4D5
                roundClosed:
                  summary: The round has closed, on schedule or early
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: This recruitment round is closed.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_CLOSED
                    traceId: 01J9EXAMPLE7K4D5
                applicationAlreadyExists:
                  summary: The student already applied to this round, in any status
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: You have already submitted an application for this round.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: APPLICATION_ALREADY_EXISTS
                    traceId: 01J9EXAMPLE7K4D5
                alreadyMember:
                  summary: The student is already an active member of this club
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: You are already a member of this club.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ALREADY_MEMBER
                    traceId: 01J9EXAMPLE7K4D5
                membershipLimitReached:
                  summary: The student is an active member of five clubs
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: Application conflicts with current state
                    status: 409
                    detail: You are already an active member of five clubs.
                    instance: /api/v1/clubs/20001/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: MEMBERSHIP_LIMIT_REACHED
                    traceId: 01J9EXAMPLE7K4D5
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      x-implementation-status: implemented
      summary: Get the minimum operational health status
      description: Public endpoint; no session is required. Must not expose secrets, environment values, or internal diagnostics.
      security: []
      responses:
        '200':
          description: Application is healthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthUp'
        '503':
          description: Application or required dependency is unhealthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthDown'
        default:
          description: Unexpected health endpoint failure
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly server-side session cookie. The frontend must not read or store it.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Current opaque token returned by GET /api/v1/auth/csrf or a successful POST /api/v1/auth/login.
  schemas:
    PositiveBigintId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^[1-9][0-9]*$'
      description: >-
        Positive decimal bigint identifier without leading zeroes. The backend
        must also enforce the signed 64-bit upper bound 9223372036854775807.
    ApplicationSubmissionRequest:
      type: object
      additionalProperties: false
      required: [motivation, answers, links]
      properties:
        motivation:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: >-
            Reason for applying. Length is measured on input in Unicode
            characters; trim surrounding whitespace before storing as
            applications.motivation and reject a blank result.
        answers:
          type: array
          description: >-
            At most one item per questionId, all belonging to this round.
            Every required question needs a nonblank answer. Omit unanswered
            optional questions; an empty array is allowed if none are required.
            The backend validates question membership, uniqueness, and lengths
            against application_questions inside the submission transaction.
          items:
            $ref: '#/components/schemas/ApplicationAnswerInput'
        links:
          type: array
          maxItems: 5
          description: >-
            Optional document attachments represented as links; send an empty
            array when attaching none. Each item becomes one application_links
            row. The backend assigns display_order from the array position,
            starting at 1. No file upload or server-side URL fetch occurs.
          items:
            $ref: '#/components/schemas/ApplicationLinkInput'
    ApplicationAnswerInput:
      type: object
      additionalProperties: false
      required: [questionId, answerText]
      properties:
        questionId:
          $ref: '#/components/schemas/PositiveBigintId'
        answerText:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            Must not exceed the matching application_questions.max_length in
            Unicode characters on input. Trim before storing as answer_text;
            a supplied answer cannot be blank even for an optional question.
    ApplicationLinkInput:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Measure input length, then trim before storing as application_links.label.
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^[hH][tT][tT][pP][sS]://[^\s\x00-\x1F\x7F/?#@]+(?:[/?#][^\s\x00-\x1F\x7F]*)?$'
          description: >-
            Absolute HTTPS URI with a host. The pattern matches the scheme
            case-insensitively, requires an authority without userinfo, and
            rejects whitespace and control characters. The backend also parses
            the URI to confirm the host. Do not trim, fetch, or download the
            URL. Store the accepted value in application_links.url.
    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [id, clubId, roundId, status, submittedAt]
      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        clubId:
          $ref: '#/components/schemas/PositiveBigintId'
        roundId:
          $ref: '#/components/schemas/PositiveBigintId'
        status:
          type: string
          const: SUBMITTED
          description: Initial persisted status, displayed as Pending to the applicant.
        submittedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Server-generated submission timestamp in UTC.
    ApplicationSubmissionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            type:
              const: urn:tuclubhub:problem:resource-conflict
            status:
              const: 409
            code:
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_OPEN
                - ROUND_CLOSED
                - APPLICATION_ALREADY_EXISTS
                - ALREADY_MEMBER
                - MEMBERSHIP_LIMIT_REACHED
    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [user, csrf]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrf:
          $ref: '#/components/schemas/CsrfTokenResponse'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: Decimal string representing a database bigint identifier.
        role:
          type: string
          enum: [USER, ADMIN]
    ClubDetail:
      type: object
      required: [id, categoryId, name, description, objectives, contactUrl, facebookUrl, instagramUrl, contactEmail, affiliationLevel, affiliationName, imageUrl, bannerUrl, status, category, tags, recruitmentRounds]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: Decimal string representing a database bigint identifier.
        categoryId:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        affiliationLevel:
          type: [string, 'null']
          maxLength: 30
        affiliationName:
          type: [string, 'null']
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
          description: If present, must use HTTPS. The backend does not fetch the URL.
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        category:
          oneOf:
            - $ref: '#/components/schemas/ClubCategory'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ClubTag'
        recruitmentRounds:
          type: array
          items:
            $ref: '#/components/schemas/PublicRecruitmentRound'
    ClubUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      description: >-
        Full replacement of editable club profile fields. name and description are
        required and non-blank. Omitted or null nullable fields are cleared. Fields
        not listed here, including category, affiliations, and status, are read-only.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
    ClubCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
    ClubTag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
    PublicRecruitmentRound:
      type: object
      required: [id, name, opensAt, closesAt, closedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
    PublicClubProfile:
      type: object
      additionalProperties: false
      description: >-
        Whitelisted public profile projection for an ACTIVE club. Does not expose
        persistence metadata, creator identity, committee data, or internal notes.
      required: [id, name, description, objectives, contactUrl, facebookUrl, instagramUrl, contactEmail, affiliationLevel, affiliationName, imageUrl, bannerUrl, category, tags]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a positive signed 64-bit database identifier.
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Public club description.
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        affiliationLevel:
          type: [string, 'null']
          maxLength: 30
        affiliationName:
          type: [string, 'null']
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
          description: If absent, clients may show their bundled default image. The backend does not fetch this URL.
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        category:
          $ref: '#/components/schemas/PublicClubCategory'
          description: Public category summary only.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubTag'
    PublicClubCategory:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
          maxLength: 100
    PublicClubTag:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
    OpenPublicRecruitmentRound:
      type: object
      additionalProperties: false
      description: >-
        Public summary returned only while the round is PUBLISHED, opensAt is less
        than or equal to the evaluation instant, the instant is before closesAt,
        and closedAt is unset. Timestamps are UTC instants serialized with Z.
      required: [id, name, opensAt, closesAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
          maxLength: 200
          description: Public display name mapped from the recruitment round title.
        opensAt:
          type: string
          format: date-time
          description: Inclusive opening instant, serialized as ISO 8601 UTC with Z.
          example: '2026-10-01T00:00:00Z'
        closesAt:
          type: string
          format: date-time
          description: Exclusive scheduled closing instant, serialized as ISO 8601 UTC with Z.
          example: '2026-10-31T16:59:59Z'
    PublicRecruitmentRoundPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenPublicRecruitmentRound'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    HealthUp:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: UP
    HealthDown:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: DOWN
  responses:
    InvalidResourceId:
      description: The id is not a valid decimal bigint identifier or is out of range
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:invalid-resource-id
            title: Invalid resource identifier
            status: 400
            detail: id must contain decimal digits and fit a positive signed 64-bit integer.
            instance: /api/v1/public/clubs/abc
            code: INVALID_RESOURCE_ID
            traceId: 01J9EXAMPLE7K4D5
    PublicClubNotFound:
      description: No active public club exists for this identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:club-not-found
            title: Club not found
            status: 404
            detail: No public club was found for this identifier.
            instance: /api/v1/public/clubs/20001
            code: CLUB_NOT_FOUND
            traceId: 01J9EXAMPLE7K4D5
    ValidationError:
      description: Request body is malformed or fails validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:validation-error
            title: Request validation failed
            status: 400
            detail: One or more request fields are invalid.
            instance: /api/v1/auth/login
            code: VALIDATION_FAILED
            fieldErrors:
              - field: username
                code: REQUIRED
                message: Username is required.
            traceId: 01J9EXAMPLE7K4D5
    AccountNotAllowed:
      description: Current account is suspended; invalidate its session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:account-not-allowed
            title: Account not allowed
            status: 403
            detail: This account is not allowed to use TU-ClubHub.
            instance: /api/v1/auth/me
            code: ACCOUNT_NOT_ALLOWED
            traceId: 01J9EXAMPLE7K4D5
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:authentication-required
            title: Authentication required
            status: 401
            detail: Sign in to access this resource.
            instance: /api/v1/auth/me
            code: AUTHENTICATION_REQUIRED
            traceId: 01J9EXAMPLE7K4D5
    Forbidden:
      description: Request is forbidden or the CSRF token is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:csrf-invalid
            title: Request rejected
            status: 403
            detail: The CSRF token is missing or invalid.
            instance: /api/v1/auth/logout
            code: CSRF_INVALID
            traceId: 01J9EXAMPLE7K4D5
    MethodNotAllowed:
      description: The request method is not supported for this path
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:method-not-allowed
            title: Method not allowed
            status: 405
            detail: The request method is not supported for this resource.
            instance: /api/v1/clubs/20001
            code: METHOD_NOT_ALLOWED
            traceId: 01J9EXAMPLE7K4D5
    ServiceUnavailable:
      description: A required dependency, such as the database, is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:service-unavailable
            title: Service unavailable
            status: 503
            detail: The request could not be completed because a required service is unavailable.
            instance: /api/v1/clubs/20001
            code: SERVICE_UNAVAILABLE
            traceId: 01J9EXAMPLE7K4D5
    ServerError:
      description: Unexpected API failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:tuclubhub:problem:internal-error
            title: Internal server error
            status: 500
            detail: The request could not be completed.
            instance: /api/v1/resource
            code: INTERNAL_ERROR
            traceId: 01J9EXAMPLE7K4D5
