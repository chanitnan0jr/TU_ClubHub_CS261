      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        label:
          type: string
          maxLength: 200
        url:
          $ref: '#/components/schemas/ApplicationLinkInput/properties/url'
        displayOrder:
          type: integer
          minimum: 1
          maximum: 2147483647
    CommitteeClubApplicationDetail:
      type: object
      additionalProperties: false
      required: [id, clubId, roundId, applicant, motivation, questionsWithAnswers, links, status, submittedAt]
      description: >-
        Read-only Task65 view. No reviews, internalComment, reviewer/decision
