openapi: 3.1.0
info:
  title: TU-ClubHub API
  version: 1.4.0
  description: >-
    TU-ClubHub API contract for foundation, public club search/profiles, application
    forms, submission, applicant status tracking, membership offer confirmation/decline,
    committee application review, internal selection decisions, selection result
    publication, and the central Admin statistics dashboard.
    Recruitment round and question management is specified in rounds.openapi.yaml.
    Authorization policy is defined in the [Permission Matrix](../security/permission-matrix.md)
    and the Sprint 2 System Design specification [task75-sprint2-design.md](../architecture/task75-sprint2-design.md),
    incorporating all recorded Task74 decisions (T74-D01 through T74-D09):
    existing unauthorized private resources return 403 ACCESS_DENIED and nonexistent
    resources return 404 RESOURCE_NOT_FOUND; INTERVIEW is excluded from MVP and
    GET operations never mutate application state; internal decisions and result
    publication are separate operations; applicant DTOs mask unreleased selection
    outcomes before results_published_at; confirm/decline supports idempotent
    same-action replay (200 OK without duplicate writes) and rejects opposite
    actions or any prior club_memberships row (ACTIVE, INACTIVE, LEFT, REMOVED)
    with 409 RESOURCE_CONFLICT.
  x-sprint2-design-handoff:
    status: specified-in-task75
    prepared-at: '2026-10-28'
    analysis-artefact: ../architecture/task74-sprint2-analysis.md
    design-artefact: ../architecture/task75-sprint2-design.md
    permission-matrix: ../security/permission-matrix.md#s2-permission-matrix
    state-machine: ../architecture/system-architecture.md#s2-application-state-machine
    business-rules: ../architecture/system-architecture.md#s2-business-rules
    decision-log: ../architecture/system-architecture.md#s2-decision-log
    selection-results-draft: ../stories/sprint2/selection-results-draft.md
    decision-source: explicit-user-instruction-2026-10-27-and-task75-design
    decision-review-status: ready-for-team-review
    recorded-decisions:
      T74-D01: existing-unauthorized-private-resource-403-nonexistent-404
      T74-D02: no-interview-mvp-optional-explicit-review-direct-decision-after-close
      T74-D03: separate-decision-and-publication-contracts-specified
      T74-D04: applicant-pre-publication-masking-and-history-allowlist-specified
      T74-D05: same-final-action-replay-without-writes-opposite-action-409
      T74-D06: fresh-action-server-time-after-lock-recheck-automatic-expiry-worker-schedule-pending-po-review
      T74-D07: same-application-replay-no-writes-all-prior-membership-rows-reject-fresh-confirmation-no-reactivation
      T74-D08: admin-dashboard-metric-definitions-and-academic-year-semester-filtering-proposed-pending-po-review
      T74-D09: application-form-read-and-submission-contract-confirmed
servers:
  - url: /
    description: Same-origin application server
tags:
  - name: Authentication
  - name: Clubs
  - name: Public Clubs
  - name: Applications
    description: Student application forms, submission (US-03), applicant status tracking (US-04), and membership confirmation/decline (US-05).
  - name: Committee Review & Results
    description: Committee read-only application review (US-09), internal selection decisions (S2-DECISION-DRAFT), and PRESIDENT result publication (S2-PUBLICATION-DRAFT).
  - name: Admin Dashboard
    description: University-wide aggregate recruitment and membership statistics for ADMIN (US-10).
  - name: Operations
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      x-implementation-status: implemented
      summary: Get a CSRF token for the browser session
      description: Returns an opaque token and the request header name. Response must not be cached.
      security: []
      responses:
        '200':
          description: CSRF token created or loaded for the current session
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Server-side session cookie; HttpOnly, Secure on HTTPS, SameSite=Lax, Path=/.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              example:
                headerName: X-CSRF-TOKEN
                token: opaque-token-value
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-implementation-status: implemented
      summary: Authenticate through the configured TU adapter
      description: >-
        Requires the CSRF header returned by /api/v1/auth/csrf. The public request
        uses username and password. The adapter maps these to the TU Authentication
        API's documented UserName and PassWord fields. On successful TU verification,
        the backend creates or refreshes the local user account, rotates the session
        ID, and saves the authenticated security context in the JDBC session. The
        session expires after 30 minutes of inactivity or 8 hours after successful
        login, whichever comes first. A fresh CSRF token for the new session is
        returned in the response body. Before calling the TU service, the backend
        counts attempts per client address and per username (case-insensitive);
        a request over either limit gets 429 RATE_LIMITED without a TU call, even
        with the correct password. Verified credentials clear that username's
        count. Requests rejected with 400 are not counted.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: student-id-or-account-name
              password: user-entered-password
      responses:
        '200':
          description: Authenticated; a rotated session cookie is set and a fresh CSRF token is returned
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Rotated server-side session cookie. Never expose the session ID in JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  id: '10001'
                  role: USER
                csrf:
                  headerName: X-CSRF-TOKEN
                  token: opaque-token-value
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credentials could not be verified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:authentication-failed
                title: Authentication failed
                status: 401
                detail: The supplied credentials could not be verified.
                instance: /api/v1/auth/login
                code: AUTHENTICATION_FAILED
                traceId: 01J9EXAMPLE7K4D5
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: >-
            Too many login attempts from this client address or for this username.
            Defaults are 50 attempts per client address per 10 minutes and 5 attempts
            per username per 15 minutes, in fixed windows.
          headers:
            Retry-After:
              description: Seconds until the limiting window ends.
              schema:
                type: integer
                minimum: 1
              example: 600
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:rate-limited
                title: Too many login attempts
                status: 429
                detail: Too many login attempts. Try again later.
                instance: /api/v1/auth/login
                code: RATE_LIMITED
                traceId: 01J9EXAMPLE7K4D5
        '503':
          description: TU Authentication API is unavailable or returned an unusable response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:auth-provider-unavailable
                title: Authentication provider unavailable
                status: 503
                detail: Authentication is temporarily unavailable.
                instance: /api/v1/auth/login
                code: AUTH_PROVIDER_UNAVAILABLE
                traceId: 01J9EXAMPLE7K4D5
        default:
          $ref: '#/components/responses/ServerError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      x-implementation-status: implemented
      summary: Get the authenticated user's current role, student status, and effective committee assignments
      description: >-
        Returns the signed-in account as it is stored now, not as it was at sign-in:
        role, studentStatus, and activeCommitteeAssignments are read again on every
        call, so a role change, appointment, revocation, or term end shows on the
        next call without signing in again (Task79). These fields are for UI
        presentation and route guarding only; every protected operation still
        checks permission itself. A missing or expired session returns 401
        AUTHENTICATION_REQUIRED. A suspended account, or a session whose account no
        longer exists, returns 403 ACCOUNT_NOT_ALLOWED; a suspended account's
        session is also invalidated.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated user with real-time role and effective committee assignments
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              examples:
                committeeMember:
                  summary: Student who currently manages one club
                  value:
                    user:
                      id: '10001'
                      role: USER
                      studentStatus: ACTIVE
                      activeCommitteeAssignments:
                        - clubId: '20001'
                          clubName: Example Club
                          permissionRole: PRESIDENT
                          positionName: Club President
                          startsAt: '2026-07-31T17:00:00Z'
                          endsAt: '2027-07-31T17:00:00Z'
                noAssignments:
                  summary: Student with no effective committee assignment
                  value:
                    user:
                      id: '10002'
                      role: USER
                      studentStatus: ACTIVE
                      activeCommitteeAssignments: []
                nonStudent:
                  summary: Account without a student profile
                  value:
                    user:
                      id: '10003'
                      role: ADMIN
                      studentStatus: null
                      activeCommitteeAssignments: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountNotAllowed'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-implementation-status: implemented
      summary: Invalidate the current session
      description: Requires both the authenticated session cookie and the current CSRF header.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Session invalidated and session cookie cleared
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/clubs:
    get:
      tags: [Public Clubs]
      operationId: searchPublicClubs
      x-implementation-status: pending
      x-contract-status: specified-in-task75
      summary: Search and filter active public clubs (US-01 / Task62)
      description: >-
        Public endpoint; authentication is not required. Returns only clubs with
        status ACTIVE. Supports case-insensitive substring search by club name (q,
        supporting Thai and English), filtering by categoryId, filtering by interest
        tagId without duplicating clubs that have multiple tags (US-01.BR-08), and
        optional recruitmentStatus filtering (default ALL so active clubs without
        open rounds remain discoverable). Blank or whitespace-only q is treated as
        omitted. Filters combine with logical AND.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search on club name; surrounding whitespace is trimmed.
          schema:
            type: string
            maxLength: 200
          example: Coding
        - name: categoryId
          in: query
          required: false
          description: Filter by club category ID.
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '30001'
        - name: tagId
          in: query
          required: false
          description: Filter by interest tag ID using EXISTS so clubs are never duplicated.
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '40001'
        - name: recruitmentStatus
          in: query
          required: false
          description: Optional filter by current open recruitment round presence; defaults to ALL.
          schema:
            type: string
            enum: [ALL, OPEN, CLOSED]
            default: ALL
          example: ALL
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Page size (1 to 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: sort
          in: query
          required: false
          description: Sort order; secondary sort by id ASC is always applied for deterministic pagination.
          schema:
            type: string
            enum: ['name,asc', 'name,desc']
            default: 'name,asc'
          example: 'name,asc'
      responses:
        '200':
          description: Paginated list of matching active public clubs; items is empty when no clubs match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClubSearchPage'
              examples:
                matchingClubs:
                  summary: Matching active clubs found
                  value:
                    items:
                      - id: '20001'
                        name: Example Club
                        description: A student club at Thammasat University.
                        affiliationLevel: University
                        affiliationName: Thammasat University
                        imageUrl: https://images.example.org/clubs/20001.png
                        category:
                          id: '30001'
                          name: Technology
                        tags:
                          - id: '40001'
                            name: Programming
                        hasOpenRecruitment: true
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                emptyResult:
                  summary: No active clubs match the selected filters
                  value:
                    items: []
                    page:
                      number: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/club-categories:
    get:
      tags: [Public Clubs]
      operationId: listPublicClubCategories
      x-implementation-status: implemented
      x-contract-status: specified-in-task75
      summary: List all club categories (search filters and the club profile editor)
      description: >-
        Public endpoint; authentication is not required. Returns every club
        category in one unpaginated list, ordered by name ascending, then id
        ascending. Used by public search filters (US-01 / Task62) and by the
        committee profile editor to choose ClubUpdateRequest.categoryId (US-06).
        An empty list is returned as items: [].
      security: []
      responses:
        '200':
          description: Club categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClubCategoryList'
              example:
                items:
                  - id: '30001'
                    name: วิชาการ
                  - id: '30002'
                    name: กีฬา
                  - id: '30003'
                    name: ศิลปวัฒนธรรม
                  - id: '30004'
                    name: บำเพ็ญประโยชน์
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/interest-tags:
    get:
      tags: [Public Clubs]
      operationId: listPublicInterestTags
      x-implementation-status: implemented
      x-contract-status: specified-in-task75
      summary: List all interest tags (search filters and the club profile editor)
      description: >-
        Public endpoint; authentication is not required. Returns every interest
        tag in one unpaginated list, ordered by name ascending, then id ascending.
        Used by public search filters (US-01 / Task62) and by the committee
        profile editor to choose ClubUpdateRequest.tagIds (US-06). An empty list
        is returned as items: [].
      security: []
      responses:
        '200':
          description: Interest tags list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClubTagList'
              example:
                items:
                  - id: '40001'
                    name: Programming
                  - id: '40002'
                    name: Music
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/clubs/{id}:
    get:
      tags: [Public Clubs]
      operationId: getPublicClubProfile
      x-implementation-status: partial
      x-sprint2-extensions-status: pending-task81
      summary: Get an active club's public profile
      description: >-
        Public endpoint; authentication is not required. Returns only an ACTIVE
        club. If the club does not exist or is inactive, return the same 404
        response so its non-public existence is not disclosed. Only the explicitly
        listed public profile fields and safe category/tag summaries may be exposed.
        Baseline profile fields are implemented; Sprint 2 adds optional canEditProfile
        (Task81). When called with an active authenticated session, canEditProfile
        reflects whether the caller currently holds an effective COMMITTEE or PRESIDENT
        assignment for this club (ADMIN alone without an effective committee assignment
        for this club receives false); anonymous callers receive canEditProfile: false.
        Because canEditProfile varies by caller session, responses must include
        Cache-Control: no-store.
        Database bigint identifiers are decimal strings on the wire. The id path
        value must contain decimal digits and fit a positive signed 64-bit integer.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Decimal string for a positive database bigint club identifier.
          schema:
            type: string
            pattern: '^[0-9]+$'
            maxLength: 19
          example: '20001'
      responses:
        '200':
          description: Active club public profile
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClubProfile'
              example:
                id: '20001'
                name: Example Club
                description: A student club at Thammasat University.
                objectives: Help students learn and collaborate.
                contactUrl: https://example.org/contact
                facebookUrl: null
                instagramUrl: null
                contactEmail: club@example.org
                affiliationLevel: University
                affiliationName: Thammasat University
                imageUrl: https://images.example.org/clubs/20001.png
                bannerUrl: null
                category:
                  id: '30001'
                  name: Technology
                tags:
                  - id: '40001'
                    name: Programming
                canEditProfile: false
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '404':
          $ref: '#/components/responses/PublicClubNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/clubs/{id}/recruitment-rounds:
    get:
      tags: [Public Clubs]
      operationId: listOpenPublicClubRecruitmentRounds
      x-implementation-status: implemented
      summary: List currently open public recruitment rounds for an active club
      description: >-
        Public endpoint; authentication is not required. The parent club must be
        ACTIVE or the endpoint returns the same 404 response as for an unknown club.
        Include only rounds with publicationStatus PUBLISHED, opensAt <= the
        evaluation instant < closesAt, and closedAt unset. The start is inclusive;
        the scheduled close is exclusive. Database timestamps are timestamptz
        instants and response timestamps are serialized as ISO 8601 UTC with Z.
        The implementation uses one backend Clock.instant() for the page query
        and total count. Deployed hosts must keep their clocks synchronized;
        no clock-skew allowance is defined.
        The response uses the API's standard paginated collection wrapper; an
        active club with no qualifying rounds returns 200 with items: [] and zero
        totals.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Decimal string for a positive database bigint club identifier.
          schema:
            type: string
            pattern: '^[0-9]+$'
            maxLength: 19
          example: '20001'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of rounds per page; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Currently open public rounds for the active club; may be empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRecruitmentRoundPage'
              examples:
                roundsAvailable:
                  summary: At least one published round is currently open
                  value:
                    items:
                      - id: '50001'
                        name: Academic Year 2026
                        description: Open to all faculties. Bring a short portfolio link if you have one.
                        opensAt: '2026-10-01T00:00:00Z'
                        closesAt: '2026-10-31T16:59:59Z'
                        resultsScheduledAt: '2026-11-07T09:00:00Z'
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                noRoundsAvailable:
                  summary: Active club has no rounds in the current open window
                  value:
                    items: []
                    page:
                      number: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '404':
          $ref: '#/components/responses/PublicClubNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/ServerError'
  /api/v1/public/recruitment-rounds:
    get:
      tags: [Public Clubs]
      operationId: listOpenPublicRecruitmentRounds
      x-implementation-status: implemented
      summary: List recruitment rounds open now across all public clubs (Open Call Board, US-07)
      description: >-
        Public endpoint; authentication is not required and a session, if sent,
        does not change the result. Returns every round that is open at the
        request's evaluation instant, across all ACTIVE clubs, using the same
        rule as /api/v1/public/clubs/{id}/recruitment-rounds: publicationStatus
        PUBLISHED, opensAt <= evaluation instant < closesAt, and closedAt unset.
        A round appears here exactly when it appears in its own club's list.
        Draft, cancelled, not-yet-open, expired, and manually closed rounds, and
        every round of an inactive club, are never returned.
        Items are ordered by closesAt ascending (soonest deadline first), then
        by id ascending, so pages are stable. Items and totals are computed
        from one evaluation instant. No open rounds returns 200 with items: []
        and zero totals; a page past the end returns items: [] with unchanged
        totals. Responses must not be cached because the result changes as
        rounds open and close.
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: size
          in: query
          required: false
          description: Number of rounds per page; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Rounds open now across active clubs, soonest deadline first; may be empty
          headers:
            Cache-Control:
              description: Always includes no-store.
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOpenCallPage'
              examples:
                openCalls:
                  summary: Two clubs are recruiting now
                  value:
                    items:
                      - id: '50002'
                        name: Photography Workshop Intake
                        description: First-year students welcome. No camera required.
                        opensAt: '2026-10-15T00:00:00Z'
                        closesAt: '2026-10-25T16:59:59Z'
                        resultsScheduledAt: null
                        club:
                          id: '20002'
                          name: Photo Club
                          imageUrl: null
                          category:
                            id: '30003'
                            name: Arts
                      - id: '50001'
                        name: Academic Year 2026
                        description: Open to all faculties. Bring a short portfolio link if you have one.
                        opensAt: '2026-10-01T00:00:00Z'
                        closesAt: '2026-10-31T16:59:59Z'
                        resultsScheduledAt: '2026-11-07T09:00:00Z'
                        club:
                          id: '20001'
                          name: Example Club
                          imageUrl: https://images.example.org/clubs/20001.png
                          category:
                            id: '30001'
                            name: Technology
                    page:
                      number: 0
                      size: 20
                      totalElements: 2
                      totalPages: 1
                noOpenCalls:
                  summary: No round is open right now
                  value:
                    items: []
                    page:
                      number: 0
                      size: 20
                      totalElements: 0
                      totalPages: 0
        '400':
          description: page or size is not an integer or is out of range
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:validation-error
                title: Request validation failed
                status: 400
                detail: One or more request fields or parameters are invalid.
