  /api/v1/me/applications/{applicationId}/confirm:
    post:
      tags: [Applications]
      operationId: confirmMembershipOffer
      x-implementation-status: pending
      x-contract-status: specified-in-task75
      summary: Confirm an accepted club membership offer (US-05 / Task69)
      description: >-
        Requires SESSION, X-CSRF-TOKEN, ACTIVE user account, and ownership of
        applicationId (403 ACCESS_DENIED if owned by another user; 404 RESOURCE_NOT_FOUND
        if nonexistent). Under T74-D05 and T74-D07, if the application is already
        CONFIRMED, returns 200 OK with idempotentReplay: true and the recorded
        outcome without re-checking deadline/student/club status or writing duplicate
        membership/history rows. For a fresh confirmation, requires ACTIVE student
        profile and ACTIVE target club (403 ACCESS_DENIED otherwise), locks the
        applicant's student_profiles row, round, and application in deterministic
        order, verifies results_published_at <= serverNow < confirmation_deadline
        (T74-D06), rejects any existing club_memberships row for (club_id, user_id)
        in any status (ACTIVE, INACTIVE, LEFT, REMOVED) with 409 EXISTING_CLUB_MEMBERSHIP
        (T74-D07), enforces the 5-active-club limit (409 MEMBERSHIP_LIMIT_REACHED),
        and atomically transitions the application to CONFIRMED while inserting the
        ACTIVE club_memberships row.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '90001'
      responses:
        '200':
          description: Membership offer confirmed (or idempotent replay of an already confirmed offer)
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOfferResponse'
              example:
                applicationId: '90001'
                clubId: '20001'
                roundId: '70001'
                status: CONFIRMED
                displayStatusLabel: ยืนยันสิทธิ์แล้ว
                respondedAt: '2026-10-28T04:15:00Z'
                membershipId: '60001'
                idempotentReplay: false
        '400':
          $ref: '#/components/responses/InvalidResourceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Application does not exist (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Offer expired, results not published, opposite action already taken, existing membership row in any status, or 5-club limit reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MembershipOfferConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
