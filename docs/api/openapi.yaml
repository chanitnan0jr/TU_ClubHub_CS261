  /api/v1/rounds/{roundId}/applications:
    post:
      tags: [Applications]
      operationId: submitApplication
      summary: Submit the current student's application with answers and document links
      x-implementation-status: implemented
      description: >-
        Contract defined in API_v1.md section 11. A suspended account receives
        403 ACCOUNT_NOT_ALLOWED even when the request body is missing or malformed,
        and the account is checked again inside the submission.
        Task42's round-scoped submission remains supported for existing consumers.
        Task52 also offers POST /api/v1/clubs/{id}/applications with an explicit
        body roundId and verified club ownership; both share this transaction.
        Requires an ACTIVE account, verified ACTIVE student profile, and ACTIVE
        target club; an inactive club returns 404 like a missing one.
        Committee/Admin callers use the same Student permissions;
        no committee assignment or term is required. Derive the applicant from
        the session and club from the round; reject unknown request fields.
        Resolve the club from roundId. The round must be PUBLISHED with published_at set,
        satisfy opens_at <= now < closes_at, and have closed_at IS NULL.
        Recheck authorization, eligibility, questions, and round state inside
        one transaction. Serialize with round close/cancel using the same round
        row lock, sample backend UTC time after locking, then persist the
        application, answers, links, and initial status history atomically.
        Respond only after commit. Use uq_applications_round_applicant as the
        final duplicate safeguard; a repeated POST conflicts rather than
        updating or replaying an application, including a withdrawn one.
        Reject existing effective membership in the target club or membership
        in five distinct locally recorded clubs across all club types.
        Effective membership means ACTIVE, joined_at <= now, and ended_at IS NULL.
        Pending applications do not count; there is no separate pending-application
        quota. Submission creates no membership. Confirmation rechecks the limit.
        Store URLs without fetching them or accepting file uploads.
        Questions support text answers only. Reject missing required answers,
        blank supplied optional answers, unknown/wrong-round question IDs, duplicate
        question IDs even with different answers, and answers exceeding that
        question's max_length with 400 VALIDATION_FAILED and fieldErrors.
        Published question editing is not allowed by the current permission
        matrix. No form version or precondition token is defined. Revalidate the
        current question set; an invalid stale answer is 400, not an invented
        FORM_CHANGED conflict. If the round closes while the form is being filled
        in, return 409 ROUND_CLOSED after the transaction-time check without writes.
        All responses use Cache-Control no-store. No numeric rate limit is set;
        a future limiter must document its thresholds and the shared 429 policy.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: roundId
          in: path
          required: true
          description: Positive PostgreSQL BIGINT decimal string without leading zeroes; maximum 9223372036854775807.
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSubmissionRequest'
            example:
              motivation: I would like to help organize club activities.
              answers:
                - questionId: '81001'
                  answerText: I have organized student workshops.
              links:
                - label: Portfolio
                  url: https://example.org/portfolio
                - label: Resume
                  url: https://example.org/resume.pdf
      responses:
        '201':
          $ref: '#/components/responses/ApplicationSubmissionCreated'
        '400':
          description: >-
            INVALID_RESOURCE_ID for invalid/out-of-range path IDs;
            VALIDATION_FAILED for malformed JSON, unknown fields, invalid or
            missing answers/links, duplicate question IDs, or questions outside
            this round. Field errors use indexed paths such as links[0].url.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: A document link is not a valid HTTPS URL
                  value:
                    type: urn:tuclubhub:problem:validation-error
                    title: Request validation failed
                    status: 400
                    detail: One or more application fields are invalid.
                    instance: /api/v1/rounds/70001/applications
                    code: VALIDATION_FAILED
                    fieldErrors:
                      - field: links[0].url
                        code: INVALID_HTTPS_URL
                        message: Use an absolute HTTPS URL with a host and no userinfo or whitespace.
                    traceId: 01J9EXAMPLE7K4D5
                invalidResourceId:
                  summary: A path ID is not a positive decimal bigint
                  value:
                    type: urn:tuclubhub:problem:invalid-resource-id
                    title: Invalid resource identifier
                    status: 400
                    detail: roundId must be a positive decimal integer that fits a signed 64-bit value.
                    instance: /api/v1/clubs/20001/rounds/abc/applications
                    code: INVALID_RESOURCE_ID
                    traceId: 01J9EXAMPLE7K4D5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            ACCOUNT_NOT_ALLOWED for a suspended account (invalidate its session);
            ACCESS_DENIED for missing verified ACTIVE student status;
            CSRF_INVALID for a missing/invalid CSRF token.
            CSRF rejection may precede authentication checks.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accessDenied:
                  summary: No verified ACTIVE student profile
                  value:
                    type: urn:tuclubhub:problem:access-denied
                    title: Access denied
                    status: 403
                    detail: An active verified student profile is required to apply.
                    instance: /api/v1/rounds/70001/applications
                    code: ACCESS_DENIED
                    traceId: 01J9EXAMPLE7K4D5
                accountNotAllowed:
                  summary: Current account is suspended; invalidate its session
                  value:
                    type: urn:tuclubhub:problem:account-not-allowed
                    title: Account not allowed
                    status: 403
                    detail: This account is not allowed to use TU-ClubHub.
                    instance: /api/v1/rounds/70001/applications
                    code: ACCOUNT_NOT_ALLOWED
                    traceId: 01J9EXAMPLE7K4D5
                csrfInvalid:
                  summary: CSRF token is missing or invalid
                  value:
                    type: urn:tuclubhub:problem:csrf-invalid
                    title: Request rejected
                    status: 403
                    detail: The CSRF token is missing or invalid.
                    instance: /api/v1/rounds/70001/applications
                    code: CSRF_INVALID
                    traceId: 01J9EXAMPLE7K4D5
        '404':
          description: >-
            RESOURCE_NOT_FOUND when the club is missing or not ACTIVE, the round
            is missing, or the round has never been
            published (published_at IS NULL). Do not reveal whether an inactive
            club or an unpublished round exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:resource-not-found
                title: Resource not found
                status: 404
                detail: "No resource was found for this identifier."
                instance: /api/v1/rounds/70001/applications
                code: RESOURCE_NOT_FOUND
                traceId: 01J9EXAMPLE7K4D5
        '409':
          description: >-
            RESOURCE_CONFLICT with a required reason. After authorization and
            visibility checks, check cancellation, not-yet-open, closed,
            duplicate application, existing target-club membership, then the
            five-club membership limit in that order. Preserve the existing
            application and roll back all new rows on a duplicate conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmissionConflict'
              examples:
                roundCancelled:
                  summary: The round was cancelled
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: "Resource state conflict"
                    status: 409
                    detail: This recruitment round has been cancelled.
                    instance: /api/v1/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_CANCELLED
                    traceId: 01J9EXAMPLE7K4D5
                roundNotOpen:
                  summary: The round has not opened yet
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: "Resource state conflict"
                    status: 409
                    detail: This recruitment round is not open for applications yet.
                    instance: /api/v1/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_NOT_OPEN
                    traceId: 01J9EXAMPLE7K4D5
                roundClosed:
                  summary: The round has closed, on schedule or early
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: "Resource state conflict"
                    status: 409
                    detail: This recruitment round is closed.
                    instance: /api/v1/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ROUND_CLOSED
                    traceId: 01J9EXAMPLE7K4D5
                applicationAlreadyExists:
                  summary: The student already applied to this round, in any status
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: "Resource state conflict"
                    status: 409
                    detail: You have already submitted an application for this round.
                    instance: /api/v1/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: APPLICATION_ALREADY_EXISTS
                    traceId: 01J9EXAMPLE7K4D5
                alreadyMember:
                  summary: The student is already an active member of this club
                  value:
                    type: urn:tuclubhub:problem:resource-conflict
                    title: "Resource state conflict"
                    status: 409
                    detail: You are already a member of this club.
                    instance: /api/v1/rounds/70001/applications
                    code: RESOURCE_CONFLICT
                    reason: ALREADY_MEMBER
                    traceId: 01J9EXAMPLE7K4D5
                membershipLimitReached:
