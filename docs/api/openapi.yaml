              example:
                type: urn:tuclubhub:problem:resource-conflict
                title: Application form unavailable
                status: 409
                instance: /api/v1/rounds/70001/application-form
                code: RESOURCE_CONFLICT
                reason: ROUND_CLOSED
                traceId: example-form-trace
