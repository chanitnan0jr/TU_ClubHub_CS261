  /api/v1/rounds/{roundId}/application-form:
    get:
      tags: [Applications]
      operationId: getRoundApplicationForm
      summary: Get the applicant-facing text-question form for a recruitment round
      x-implementation-status: pending
      x-contract-status: defined-pending-review
      x-review-required:
        - Confirm whether prior application or membership eligibility should additionally block reading the form; not specified as a GET rejection here.
      description: >-
        A valid SESSION is required, not public access or a committee permission.
        GET requires no CSRF header. The Task42 requester confirmed the same
        account/student and open-round checks as submission on 2026-10-20:
        require an ACTIVE account and verified ACTIVE student; Committee/Admin
        callers use Student rights. Hide missing/inactive clubs and
        never-published rounds with 404, and allow 200 only for a PUBLISHED round
        with published_at set, opens_at <= now < closes_at and closed_at IS NULL.
        A previously published cancelled/not-yet-open/closed round returns
        409 with ROUND_CANCELLED/ROUND_NOT_OPEN/ROUND_CLOSED in that order.
        Apply checks in order: session/account, path ID, verified student, visible
        round/club, then round availability. Duplicate-application and membership
        conflicts remain submission checks; adding them as form-read rejections
        needs a separate decision. PO/team review remains pending as recorded in
        section 12 of API_v1.md; submission rules are defined in section 11.
        Resolve the club from roundId. Return one form resource, not a paginated
        question collection. Questions are TEXT only, sorted by displayOrder
        ascending then id ascending; return questions [] if none exist. Do not
        include answers, applicants, reviews, creator IDs, or internal round data.
        All responses use Cache-Control no-store. Read backend UTC time once for
        availability; opening is inclusive and closing exclusive. Loading a form
        never reserves an application slot or guarantees later submission.
      security:
        - SessionCookie: []
      parameters:
        - name: roundId
          in: path
          required: true
          description: Positive PostgreSQL BIGINT decimal string without leading zeroes; maximum 9223372036854775807.
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
      responses:
        '200':
          description: Applicant-facing form for an eligible student and currently open published round
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundApplicationForm'
              examples:
                textQuestions:
                  summary: Text-only form with required and optional questions
                  value:
                    round:
                      id: '70001'
                      clubId: '20001'
                      title: Volunteer recruitment
                      description: Join our student activities team.
                      eligibilityText: Active TU students interested in volunteering.
                      opensAt: '2026-10-20T02:00:00Z'
                      closesAt: '2026-11-01T10:00:00Z'
                    questions:
                      - id: '81001'
                        type: TEXT
                        questionText: Describe an activity you helped organize.
                        isRequired: true
                        displayOrder: 1
                        maxLength: 2000
                      - id: '81002'
                        type: TEXT
                        questionText: What other experience would you like to share?
                        isRequired: false
                        displayOrder: 3
                        maxLength: 1000
                noQuestions:
                  summary: No custom screening questions; motivation remains required on submission
                  value:
                    round:
                      id: '70002'
                      clubId: '20001'
                      title: General recruitment
                      description: Applications without custom screening questions.
                      eligibilityText: null
                      opensAt: '2026-10-20T02:00:00Z'
                      closesAt: '2026-11-01T10:00:00Z'
                    questions: []
        '400':
          description: INVALID_RESOURCE_ID for malformed or out-of-range roundId
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:tuclubhub:problem:invalid-resource-id
                title: Invalid resource identifier
                status: 400
                instance: /api/v1/rounds/abc/application-form
                code: INVALID_RESOURCE_ID
                traceId: example-form-trace
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            ACCOUNT_NOT_ALLOWED for a suspended account (invalidate session).
            ACCESS_DENIED for missing verified ACTIVE student status.
            GET does not require a CSRF header.
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >-
            Submission visibility also applies here: RESOURCE_NOT_FOUND
