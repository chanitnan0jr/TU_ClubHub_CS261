                    SUBMITTED: 120
                    UNDER_REVIEW: 210
                    ACCEPTED: 110
                    REJECTED: 320
                    CONFIRMED: 410
                    DECLINED: 65
                    WITHDRAWN: 15
                    EXPIRED: 30
                categoryBreakdown:
                  - categoryId: '1'
                    categoryName: วิชาการและนวัตกรรม
                    clubCount: 12
                    totalRounds: 14
                    totalApplications: 490
                    acceptedCount: 220
                    confirmedCount: 185
                    activeMemberCount: 640
                topClubs:
                  - clubId: '20001'
                    clubName: ชมรมพัฒนาซอฟต์แวร์แห่งมหาวิทยาลัยธรรมศาสตร์
                    categoryName: วิชาการและนวัตกรรม
                    totalApplications: 165
