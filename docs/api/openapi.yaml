        assignment for the club owning roundId, with no self-review conflict.
        The round must be PUBLISHED, not CANCELLED, effectively closed
        (serverNow >= COALESCE(closed_at, closes_at)), and unpublished
        (results_published_at IS NULL). Supports direct transition from SUBMITTED
        or UNDER_REVIEW to ACCEPTED or REJECTED, and allows updating ACCEPTED/REJECTED
        prior to publication with optimistic lock version checking (T74-D02, T74-D03).
        Does not expose the decision to the applicant until POST /publish-results commits.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '90001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
            example:
              decision: ACCEPTED
              resultMessage: Congratulations! Please confirm your membership before the deadline.
              internalNote: Strong portfolio and workshop experience.
              version: 0
      responses:
        '200':
          description: Internal selection decision saved
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeApplicationDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Round or application does not exist (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Round still open, results already published, round cancelled, or optimistic lock version mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApplicationDecisionConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/rounds/{roundId}/publish-results:
    post:
      tags: [Committee Review & Results]
      operationId: publishRoundSelectionResults
      x-implementation-status: pending
      x-contract-status: specified-in-task75
      summary: Publish finalized selection results for a recruitment round (S2-PUBLICATION-DRAFT / Task67)
      description: >-
        Requires SESSION, X-CSRF-TOKEN, and an effective PRESIDENT assignment for
        the club owning roundId, with no self-review conflict. General COMMITTEE
        members and ADMIN without an effective PRESIDENT assignment receive 403 ACCESS_DENIED.
        The round must be PUBLISHED, effectively closed, unpublished (results_published_at IS NULL),
        serverNow < confirmation_deadline, and every active application in the round
        must already be decided as ACCEPTED or REJECTED (none remaining in SUBMITTED
        or UNDER_REVIEW). Sets recruitment_rounds.results_published_at = serverNow,
        increments version, and creates RESULT_PUBLISHED notifications in one transaction
        without writing same-state rows to application_status_history (T74-D03).
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PositiveBigintId'
          example: '70001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishResultsRequest'
            example:
              version: 1
      responses:
        '200':
          description: Selection results published atomically
          headers:
            Cache-Control:
              $ref: '#/components/headers/ApplicationNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResultsResponse'
              example:
                roundId: '70001'
                clubId: '20001'
                resultsPublishedAt: '2026-10-26T03:00:00Z'
                confirmationDeadline: '2026-11-05T16:59:59Z'
                acceptedCount: 12
                rejectedCount: 8
                roundVersion: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Round does not exist (RESOURCE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Undecided applications remain, round still open, already published, deadline passed, or version mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PublishResultsConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
