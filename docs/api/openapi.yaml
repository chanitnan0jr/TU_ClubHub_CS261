        studentCode:
          type: string
          maxLength: 20
        displayName:
          type: string
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        facultyName:
          type: [string, 'null']
          maxLength: 200
        departmentName:
          type: [string, 'null']
          maxLength: 200
        programName:
          type: [string, 'null']
          maxLength: 200
        studyYear:
          type: [integer, 'null']
          minimum: 1
          maximum: 32767
    CommitteeClubApplicationSummary:
      type: object
      additionalProperties: false
      required: [id, roundId, applicant, submittedAt, status]
      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        roundId:
          $ref: '#/components/schemas/PositiveBigintId'
        applicant:
          $ref: '#/components/schemas/CommitteeApplicantIdentity'
        submittedAt:
          type: string
          format: date-time
          pattern: 'Z$'
        status:
          $ref: '#/components/schemas/InternalApplicationStatus'
    CommitteeClubApplicationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommitteeClubApplicationSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    CommitteeClubDocumentLink:
