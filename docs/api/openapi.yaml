components:
  headers:
    ApplicationNoStore:
      description: Do not cache applicant form or submission responses, including failures.
      schema:
        type: string
        const: no-store
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly server-side session cookie. The frontend must not read or store it.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Current opaque token returned by GET /api/v1/auth/csrf or a successful POST /api/v1/auth/login.
  schemas:
    PositiveBigintId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^[1-9][0-9]*$'
      description: >-
        Positive decimal bigint identifier without leading zeroes. The backend
        must also enforce the signed 64-bit upper bound 9223372036854775807.
    RoundApplicationForm:
      type: object
      additionalProperties: false
      required: [round, questions]
      description: >-
        Applicant-facing resource, separate from committee round/question DTOs.
        Render motivation and optional HTTPS document links using constraints in
        ApplicationSubmissionRequest. questions contains all custom screening
        questions, not a page; it may be empty. No existing application is returned.
      properties:
        round:
          $ref: '#/components/schemas/ApplicationFormRound'
        questions:
          type: array
          description: Ascending displayOrder, then numeric id; gaps in displayOrder are valid.
          items:
            $ref: '#/components/schemas/ApplicationTextQuestion'
    ApplicationFormRound:
      type: object
      additionalProperties: false
      required: [id, clubId, title, description, eligibilityText, opensAt, closesAt]
      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        clubId:
          $ref: '#/components/schemas/PositiveBigintId'
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Published applicant-facing round description; not an internal review note.
        eligibilityText:
          type: [string, 'null']
          description: Applicant-facing recruitment_rounds.eligibility_text; null when unspecified. Text alone is not a machine-enforced eligibility rule.
        opensAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: ISO 8601 UTC; submission starts inclusively at this instant.
        closesAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: ISO 8601 UTC; submission ends exclusively at this instant. Manual close can end submission earlier.
    ApplicationTextQuestion:
      type: object
      additionalProperties: false
      required: [id, type, questionText, isRequired, displayOrder, maxLength]
      description: >-
        US-08 and application_questions support text answers only. There are no
        choice options, numeric answers, or uploads. type is a DTO discriminator
        derived from that model, not a database column. questionText maps prompt;
        isRequired maps is_required. id is used as answers[].questionId on POST.
      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        type:
          type: string
          enum: [TEXT]
        questionText:
          type: string
          minLength: 1
          pattern: '\S'
        isRequired:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: application_questions.max_length; answerText limit in Unicode characters on input before trimming, default in DB is 2000.
    ApplicationFormAvailabilityConflict:
      description: Form availability conflict; duplicate and membership conflicts belong to submission, not form reads.
      allOf:
        - $ref: '#/components/schemas/ApplicationSubmissionConflict'
        - type: object
          properties:
            reason:
              type: string
              enum: [ROUND_CANCELLED, ROUND_NOT_OPEN, ROUND_CLOSED]
    ApplicationSubmissionRequest:
      type: object
      additionalProperties: false
      required: [motivation, answers, links]
      properties:
        motivation:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: >-
            Reason for applying. Length is measured on input in Unicode
            characters; trim surrounding whitespace before storing as
            applications.motivation and reject a blank result.
        answers:
          type: array
          description: >-
            At most one item per questionId, all belonging to this round.
            Every required question needs a nonblank answer. Omit unanswered
            optional questions; an empty array is allowed if none are required.
            The backend validates question membership, uniqueness, and lengths
            against application_questions inside the submission transaction.
          items:
            $ref: '#/components/schemas/ApplicationAnswerInput'
        links:
          type: array
          maxItems: 5
          description: >-
            Optional document attachments represented as links; send an empty
            array when attaching none. Each item becomes one application_links
            row. The backend assigns display_order from the array position,
            starting at 1. No file upload or server-side URL fetch occurs.
          items:
            $ref: '#/components/schemas/ApplicationLinkInput'
    ClubApplicationSubmissionRequest:
      type: object
      additionalProperties: false
      required: [roundId, motivation, answers, links]
      description: >-
        Explicit round selection for the Task52 club route. Only roundId is
        added to the existing submission content. The round must belong to the
        path club. No implicit selection, client identity, status, attachment
        references or uploads. All fields are non-null; answers and links may
        be empty only under their existing validation rules.
      properties:
        roundId:
          $ref: '#/components/schemas/PositiveBigintId'
          description: Required explicit round selection, validated against the path club inside the transaction.
        motivation:
          $ref: '#/components/schemas/ApplicationSubmissionRequest/properties/motivation'
        answers:
          $ref: '#/components/schemas/ApplicationSubmissionRequest/properties/answers'
        links:
          $ref: '#/components/schemas/ApplicationSubmissionRequest/properties/links'
    ApplicationAnswerInput:
      type: object
      additionalProperties: false
      required: [questionId, answerText]
      properties:
        questionId:
          $ref: '#/components/schemas/PositiveBigintId'
        answerText:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            Must not exceed the matching application_questions.max_length in
            Unicode characters on input. Trim before storing as answer_text;
            a supplied answer cannot be blank even for an optional question.
    ApplicationLinkInput:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Measure input length, then trim before storing as application_links.label.
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^[hH][tT][tT][pP][sS]://[^\s\x00-\x1F\x7F/?#@]+(?:[/?#][^\s\x00-\x1F\x7F]*)?$'
          description: >-
            Absolute HTTPS URI with a host. The pattern matches the scheme
            case-insensitively, requires an authority without userinfo, and
            rejects whitespace and control characters. The backend also parses
            the URI to confirm the host. Do not trim, fetch, or download the
            URL. Store the accepted value in application_links.url.
    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [id, clubId, roundId, status, submittedAt]
      properties:
        id:
          $ref: '#/components/schemas/PositiveBigintId'
        clubId:
          $ref: '#/components/schemas/PositiveBigintId'
        roundId:
          $ref: '#/components/schemas/PositiveBigintId'
        status:
          type: string
          const: SUBMITTED
          description: Initial persisted status, displayed as Pending to the applicant.
        submittedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: >-
            Server-generated submission timestamp in UTC with at most six fractional
            second digits. Both submission routes sample the clock once after the
            round lock and truncate to microseconds before checks and writes. This
            value equals applications.submitted_at and the initial history changed_at;
            the inclusive opening and exclusive closing boundaries are unchanged.
    ApplicationSubmissionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            type:
              const: urn:tuclubhub:problem:resource-conflict
            status:
              const: 409
            code:
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_OPEN
                - ROUND_CLOSED
                - APPLICATION_ALREADY_EXISTS
                - ALREADY_MEMBER
                - MEMBERSHIP_LIMIT_REACHED
    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [user, csrf]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrf:
          $ref: '#/components/schemas/CsrfTokenResponse'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: Decimal string representing a database bigint identifier.
        role:
          type: string
          enum: [USER, ADMIN]
        studentStatus:
          type: [string, 'null']
          enum: [ACTIVE, INACTIVE, GRADUATED, UNKNOWN, null]
          description: >-
            Stored student status, refreshed at each TU sign-in; only ACTIVE grants
            student or committee rights. Null when the account has no student
            profile (for example, a non-student account). Always present in
            GET /api/v1/auth/me; the login response omits it (Task79).
        activeCommitteeAssignments:
          type: array
          description: >-
            Every committee assignment that grants committee rights at the time of
            the call, across all clubs, ordered by clubName. Empty when there are
            none. Use it to show Committee Workspace entries and club edit actions
            without signing in again. A user can have more than one entry for a
            club when assignments overlap. Always present in GET /api/v1/auth/me;
            the login response omits it (Task79).
          items:
            $ref: '#/components/schemas/ActiveCommitteeAssignmentSummary'
    ActiveCommitteeAssignmentSummary:
      type: object
      additionalProperties: false
      required: [clubId, clubName, permissionRole, positionName, startsAt, endsAt]
      description: >-
        One assignment that currently grants committee rights in a club. It is
        listed only while the same rule that authorizes committee operations holds:
        the assignment is not revoked and its term has started and not ended
        (startsAt <= server time < endsAt), the user's membership in the club has
        started, is active and has not ended, the account and student status are
        ACTIVE, and the club is ACTIVE (Task79).
      properties:
        clubId:
          type: string
          pattern: '^[0-9]+$'
          description: Club the assignment is for; use it as {clubId} in committee paths.
        clubName:
          type: string
          maxLength: 200
        permissionRole:
          type: string
          enum: [COMMITTEE, PRESIDENT]
          description: Committee rights level; PRESIDENT also allows president-only actions.
        positionName:
          type: string
          maxLength: 100
          description: Display title of the position, for example Club President. It grants no rights by itself.
        startsAt:
          type: string
          format: date-time
          description: Start of the term (inclusive).
        endsAt:
          type: string
          format: date-time
          description: End of the term (exclusive); from this instant the entry is no longer listed.
    ClubDetail:
      type: object
      required: [id, categoryId, name, description, objectives, contactUrl, facebookUrl, instagramUrl, contactEmail, affiliationLevel, affiliationName, imageUrl, bannerUrl, status, category, tags, recruitmentRounds]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: Decimal string representing a database bigint identifier.
        categoryId:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        affiliationLevel:
          type: [string, 'null']
          maxLength: 30
        affiliationName:
          type: [string, 'null']
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
          description: If present, must use HTTPS. The backend does not fetch the URL.
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        category:
          oneOf:
            - $ref: '#/components/schemas/ClubCategory'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ClubTag'
        recruitmentRounds:
          type: array
          items:
            $ref: '#/components/schemas/PublicRecruitmentRound'
        canEditProfile:
          type: boolean
          description: >-
            True ONLY when the authenticated caller holds an effective
            COMMITTEE or PRESIDENT assignment for this club (Task81). System
            ADMIN without an effective committee assignment for this club
            receives false because PUT /api/v1/clubs/{clubId} is restricted to
            the club's effective committee members.
    ClubUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description, categoryId, tagIds]
      description: >-
        Full replacement of editable club profile fields. name and description are
        required and non-blank; categoryId and tagIds are required. Omitted or null
        nullable fields are cleared. Fields not listed here, including affiliations
        and status, are read-only.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
        description:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        categoryId:
          $ref: '#/components/schemas/PositiveBigintId'
          description: Id of an existing club category from GET /api/v1/public/club-categories.
        tagIds:
          type: array
          maxItems: 10
          uniqueItems: true
          description: >-
            Complete new set of interest tag ids from GET /api/v1/public/interest-tags.
            Replaces the club's current tags; [] removes them all. Order is not
            significant; the response lists tags in its own order.
          items:
            $ref: '#/components/schemas/PositiveBigintId'
    ClubCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
    ClubTag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
    PublicRecruitmentRound:
      type: object
      description: >-
        Published round summary. Draft rounds are never included. The round's
        separate eligibility text is not exposed.
      required: [id, name, description, opensAt, closesAt, closedAt, resultsScheduledAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        name:
          type: string
        description:
          type: string
          description: >-
            Round details and applicant qualifications as written by the club
            committee. Plain text; may contain line breaks. Clients must escape
            it when rendering.
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        resultsScheduledAt:
          type: [string, 'null']
          format: date-time
          description: Planned results announcement instant; null when the club has not scheduled one.
    PublicClubProfile:
      type: object
      additionalProperties: false
      description: >-
        Whitelisted public profile projection for an ACTIVE club. Does not expose
        persistence metadata, creator identity, committee data, or internal notes.
      required: [id, name, description, objectives, contactUrl, facebookUrl, instagramUrl, contactEmail, affiliationLevel, affiliationName, imageUrl, bannerUrl, category, tags]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a positive signed 64-bit database identifier.
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Public club description.
        objectives:
          type: [string, 'null']
        contactUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        facebookUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        instagramUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
        affiliationLevel:
          type: [string, 'null']
          maxLength: 30
        affiliationName:
          type: [string, 'null']
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
          description: If absent, clients may show their bundled default image. The backend does not fetch this URL.
        bannerUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        category:
          $ref: '#/components/schemas/PublicClubCategory'
          description: Public category summary only.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubTag'
        canEditProfile:
          type: boolean
          description: >-
            Optional capability flag indicating whether the caller can edit this club's
            profile (false for anonymous callers, non-committee users, and system ADMINs
            without an effective committee assignment for this club; true ONLY when the
            authenticated caller holds an effective COMMITTEE or PRESIDENT assignment
            for this club — Task81).
    PublicClubCategory:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
          maxLength: 100
    PublicClubTag:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
    PublicClubCategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubCategory'
    PublicClubTagList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubTag'
    PublicClubSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, affiliationLevel, affiliationName, imageUrl, category, tags, hasOpenRecruitment]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Public club description projected for directory cards.
        affiliationLevel:
          type: [string, 'null']
          maxLength: 30
        affiliationName:
          type: [string, 'null']
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
        category:
          $ref: '#/components/schemas/PublicClubCategory'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubTag'
        hasOpenRecruitment:
          type: boolean
          description: >-
            True when at least one round for this club has publication_status =
            'PUBLISHED', closed_at IS NULL, and opens_at <= now < closes_at at
            the request evaluation instant.
    PublicClubSearchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicClubSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    OpenPublicRecruitmentRound:
      type: object
      additionalProperties: false
      description: >-
        Public summary returned only while the round is PUBLISHED, opensAt is less
        than or equal to the evaluation instant, the instant is before closesAt,
        and closedAt is unset. Timestamps are UTC instants serialized with Z.
        The round's separate eligibility text is not exposed.
      required: [id, name, description, opensAt, closesAt, resultsScheduledAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier.
        name:
          type: string
          maxLength: 200
          description: Public display name mapped from the recruitment round title.
        description:
          type: string
          description: >-
            Round details and applicant qualifications as written by the club
            committee. Plain text; may contain line breaks. Clients must escape
            it when rendering.
          example: Open to all faculties. Bring a short portfolio link if you have one.
        opensAt:
          type: string
          format: date-time
          description: Inclusive opening instant, serialized as ISO 8601 UTC with Z.
          example: '2026-10-01T00:00:00Z'
        closesAt:
          type: string
          format: date-time
          description: Exclusive scheduled closing instant, serialized as ISO 8601 UTC with Z.
          example: '2026-10-31T16:59:59Z'
        resultsScheduledAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Planned results announcement instant, serialized as ISO 8601 UTC with
            Z; null when the club has not scheduled one.
          example: '2026-11-07T09:00:00Z'
    PublicRecruitmentRoundPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenPublicRecruitmentRound'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PublicOpenCallClub:
      type: object
      additionalProperties: false
      description: Safe summary of the ACTIVE club that runs an open round.
      required: [id, name, imageUrl, category]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint identifier; use it to open /api/v1/public/clubs/{id}.
        name:
          type: string
          maxLength: 200
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https://\S+$'
          description: HTTPS logo URL, or null when unset; the client shows its own fallback image.
        category:
          $ref: '#/components/schemas/PublicClubCategory'
    PublicOpenCall:
      type: object
      additionalProperties: false
      description: >-
        One open round on the Open Call Board. Round fields have the same
        meaning as OpenPublicRecruitmentRound; club identifies who is recruiting.
      required: [id, name, description, opensAt, closesAt, resultsScheduledAt, club]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: Decimal string representing a database bigint round identifier.
        name:
          type: string
          maxLength: 200
          description: Public display name of the round.
        description:
          type: string
          description: Round details and applicant qualifications; plain text that clients must escape.
        opensAt:
          type: string
          format: date-time
          description: Inclusive opening instant, serialized as ISO 8601 UTC with Z.
        closesAt:
          type: string
          format: date-time
          description: Exclusive scheduled closing instant, serialized as ISO 8601 UTC with Z.
        resultsScheduledAt:
          type: [string, 'null']
          format: date-time
          description: Planned results announcement instant, or null when not scheduled.
        club:
          $ref: '#/components/schemas/PublicOpenCallClub'
    PublicOpenCallPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicOpenCall'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    InternalApplicationStatus:
      type: string
      description: >-
        Authoritative internal application lifecycle status stored in
        applications.status (V1__init_schema.sql). Pre-publication internal
        states (SUBMITTED, UNDER_REVIEW, ACCEPTED, REJECTED) are visible to
        Committee/Admin but masked as SUBMITTED from applicants until
        round.results_published_at is set (T74-D02 / T74-D04).
      enum:
        - SUBMITTED
        - UNDER_REVIEW
        - ACCEPTED
        - REJECTED
        - CONFIRMED
        - DECLINED
        - WITHDRAWN
        - EXPIRED
    ApplicantVisibleStatus:
      type: string
      description: >-
        Applicant-visible projection of application status (T74-D02 / T74-D04).
        While round.results_published_at is null, internal SUBMITTED,
        UNDER_REVIEW, ACCEPTED, and REJECTED all project as SUBMITTED
        (displayStatusLabel: "รอพิจารณา") so internal review progress and
        draft decisions never leak before publication. After publication,
        internal ACCEPTED projects as ACCEPTED_PENDING_CONFIRMATION
        (displayStatusLabel: "ผ่านการคัดเลือก (รอยืนยันสิทธิ์)").
      enum:
        - SUBMITTED
        - ACCEPTED_PENDING_CONFIRMATION
        - REJECTED
        - CONFIRMED
        - DECLINED
        - EXPIRED
        - WITHDRAWN
    CommitteeApplicantIdentity:
      type: object
      additionalProperties: false
      required: [userId, studentCode, displayName, email, facultyName, departmentName, programName, studyYear]
      description: >-
        Authorized US-09 applicant projection from users and student_profiles.
        No TU username, account flags, credential, reviewer data or full profile
        object. Nullable fields are returned explicitly as null. studyYear follows
        the actual positive SMALLINT database range, not an invented ten-year cap.
