          minimum: 0
        underReviewCount:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        confirmedCount:
          type: integer
          minimum: 0
        declinedCount:
          type: integer
          minimum: 0
        withdrawnCount:
          type: integer
          minimum: 0
        expiredCount:
          type: integer
          minimum: 0
        activeMemberCount:
          type: integer
