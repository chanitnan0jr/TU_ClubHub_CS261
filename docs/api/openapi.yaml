    StartApplicationReviewRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: >-
        Transitions an application from SUBMITTED to UNDER_REVIEW (or updates
        review notes while already in UNDER_REVIEW) before round results are
        published (T74-D02). When recommendation or internalComment is provided,
        recommendation is required because application_reviews.recommendation is
        NOT NULL in V1__init_schema.sql (defaults to DISCUSS when omitted while
        internalComment is present).
      properties:
        recommendation:
          type: [string, 'null']
          enum: [ACCEPT, REJECT, DISCUSS, null]
          description: >-
            Optional committee review recommendation stored in
            application_reviews.recommendation. If internalComment is provided
            and recommendation is omitted/null, the backend defaults
            recommendation to DISCUSS.
        internalComment:
          type: [string, 'null']
          maxLength: 2000
          description: Optional internal review comment stored in application_reviews.internal_comment.
        version:
          type: integer
          minimum: 0
          description: Expected applications.version for optimistic locking.
    ApplicationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, version]
      description: >-
        Records or updates a pre-publication selection decision (ACCEPTED or
        REJECTED) on an application after the round has closed and while
        round.results_published_at is null (T74-D02 / T74-D03). When
        internalNote is non-blank, the backend also upserts the caller's
        application_reviews row (mapping decision ACCEPTED -> recommendation
        ACCEPT and REJECTED -> recommendation REJECT, with internal_comment =
        internalNote).
      properties:
        decision:
          type: string
          enum: [ACCEPTED, REJECTED]
        resultMessage:
          type: [string, 'null']
          maxLength: 1000
          description: >-
            Applicant-facing feedback stored in applications.result_message;
            hidden from the applicant until round.results_published_at is set.
        internalNote:
          type: [string, 'null']
          maxLength: 2000
          description: >-
            Committee-only note stored in application_reviews.internal_comment
            and/or application_status_history.reason; never exposed to applicants.
        version:
          type: integer
          minimum: 0
          description: Expected applications.version for optimistic locking.
    ApplicationDecisionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_PUBLISHED
                - ROUND_STILL_OPEN
                - RESULTS_ALREADY_PUBLISHED
                - INVALID_STATUS_TRANSITION
                - VERSION_MISMATCH
    PublishResultsRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: >-
        Atomically publishes all pre-recorded ACCEPTED and REJECTED decisions
        for a closed recruitment round by setting
        recruitment_rounds.results_published_at = serverNow and queuing outbox
        notifications for all decided applications (T74-D03). The round's
        confirmation_deadline is already stored on recruitment_rounds.
      properties:
        version:
          type: integer
          minimum: 0
          description: Expected recruitment_rounds.version for optimistic locking.
    PublishResultsResponse:
      type: object
      additionalProperties: false
      required: [roundId, clubId, resultsPublishedAt, confirmationDeadline, acceptedCount, rejectedCount, roundVersion]
      properties:
        roundId:
          type: string
          pattern: '^[0-9]+$'
        clubId:
          type: string
          pattern: '^[0-9]+$'
        resultsPublishedAt:
          type: string
          format: date-time
        confirmationDeadline:
          type: string
          format: date-time
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        roundVersion:
          type: integer
          minimum: 0
    PublishResultsConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reason]
          properties:
            code:
              type: string
              const: RESOURCE_CONFLICT
            reason:
              type: string
              enum:
                - ROUND_CANCELLED
                - ROUND_NOT_PUBLISHED
                - ROUND_STILL_OPEN
                - RESULTS_ALREADY_PUBLISHED
                - CONFIRMATION_DEADLINE_EXPIRED
                - APPLICATIONS_INCOMPLETE
                - VERSION_MISMATCH
