                      opensAt: '2026-10-20T02:00:00Z'
                      closesAt: '2026-11-01T10:00:00Z'
                    questions:
                      - id: '81001'
                        type: TEXT
                        questionText: Describe an activity you helped organize.
                        isRequired: true
                        displayOrder: 1
                        maxLength: 2000
                      - id: '81002'
                        type: TEXT
                        questionText: What other experience would you like to share?
                        isRequired: false
                        displayOrder: 3
                        maxLength: 1000
                noQuestions:
                  summary: No custom screening questions; motivation remains required on submission
                  value:
                    round:
                      id: '70002'
                      clubId: '20001'
                      title: General recruitment
