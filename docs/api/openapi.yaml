          type: string
          description: Localized Thai status label corresponding to applicantVisibleStatus.
        canConfirm:
          type: boolean
          description: >-
            True ONLY when round.publication_status = 'PUBLISHED',
            round.results_published_at is non-null, internal status is ACCEPTED,
            and round.results_published_at <= serverNow < round.confirmation_deadline
            (strict < per T74-D06).
        canDecline:
          type: boolean
          description: >-
            True ONLY when round.publication_status = 'PUBLISHED',
            round.results_published_at is non-null, internal status is ACCEPTED,
            and round.results_published_at <= serverNow < round.confirmation_deadline
            (strict < per T74-D06).
        respondedAt:
          type: [string, 'null']
          format: date-time
